<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bret and Nicole WDW Park Board">
<meta name="theme-color" content="#1b1f4a">
<title>Bret and Nicole WDW Park Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly, glanceable, built to be checked twenty times a day in a queue.
   IDEA: the in-park tip board — big wait numbers on a lit board, one colour per park.
   PICTURE: the board itself; the home screen is four park tiles you can read in one glance.
   COLOUR and TYPE: midnight-indigo chrome, per-park accents, wait pills on a teal→gold→coral heat scale; Outfit numerals + Inter.
   LAYOUT: slim sticky header, bottom tab bar within thumb reach, one column on phones, grid on wide screens. */
:root{color-scheme:light dark;
--bg:light-dark(#f4f3fb,#0d0f24);--card:light-dark(#ffffff,#171a38);--ink:light-dark(#171a3a,#eef0ff);
--mute:light-dark(#5e6288,#a3a8d4);--line:light-dark(#e3e2f2,#272b55);--chrome:#1b1f4a;--soft:light-dark(#eeedf8,#232750);
--short:light-dark(#0f8f86,#2fc7b9);--mid:light-dark(#b07a00,#f2b631);--long:light-dark(#d2453a,#ff7a6b);
--accent:#5b4bdb;--accent-ink:light-dark(#4a3bc4,#b9b0ff);--navh:62px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.num{font-family:Outfit,system-ui,sans-serif}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid #ffb800;outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--chrome);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) max(4vw,14px) 8px}
.bar{display:flex;align-items:center;gap:10px;max-width:1240px;margin:auto}
.ttl{flex:1}
.ttl h1{font-size:17px;line-height:1.2;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stamp{font-size:12.5px;color:#c9ccf5;white-space:nowrap}
.refresh{background:#ffffff1f;border:0;border-radius:999px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;flex:none}
.refresh svg{width:20px;height:20px}
.refresh.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.refresh.spin svg{animation:none}}
.pswitch{display:flex;gap:4px;max-width:1240px;margin:8px auto 0;background:#ffffff14;border-radius:14px;padding:4px}
.pswitch:empty{display:none}
.pswitch button{flex:1;border:0;background:none;color:#d9dcff;border-radius:10px;min-height:40px;font-weight:600;font-size:15px;cursor:pointer;padding:0 4px;white-space:nowrap}
.pswitch button[aria-pressed=true]{background:var(--pc);color:#fff;box-shadow:0 1px 4px #0005}

/* bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:light-dark(#ffffffef,#14173aef);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom)}
.tabbar div{display:flex;max-width:640px;margin:auto}
.tabbar button{flex:1;border:0;background:none;height:var(--navh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--mute);cursor:pointer}
.tabbar svg{width:24px;height:24px}
.tabbar button[aria-current=page]{color:var(--accent-ink)}
main{max-width:1240px;margin:auto;padding:14px max(4vw,14px) calc(var(--navh) + env(safe-area-inset-bottom) + 24px)}

/* shared */
.banner{background:light-dark(#fff3d6,#3a2e0c);color:light-dark(#6b4a00,#ffd98a);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;align-items:start}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 6px 20px -14px #1b1f4a66}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 14px 6px}
.ch h2{margin:0;font-size:16px;font-weight:700}
.ch span{font-size:13px;color:var(--mute)}
.sect{font-family:Outfit;font-size:15px;font-weight:700;color:var(--mute);margin:18px 2px 8px}
.sect:first-child{margin-top:4px}
.empty{padding:20px 16px;color:var(--mute);text-align:center;font-size:15px}
.hint{padding:12px 14px;color:var(--mute);font-size:14px}
.foot{color:var(--mute);font-size:12.5px;text-align:center;margin-top:24px;line-height:1.6}
.note{font-size:13.5px;color:var(--mute);padding:10px 14px;border-top:1px solid var(--line)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pc);margin-right:5px;vertical-align:1px}
.good{color:var(--short);font-weight:600}.llc{color:var(--accent-ink);font-weight:600}.bad{color:var(--long);font-weight:600}
.tag{font-size:12.5px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--mute);white-space:nowrap}
.tag.good{background:light-dark(#dcf5f2,#123b38)}.tag.bad{background:light-dark(#ffe3df,#4a1d1a)}

/* rows */
.row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);min-height:58px}
.row:first-child{border-top:0}
.row .nm{flex:1;font-weight:600;line-height:1.3}
.sub2{display:block;font-size:13.5px;color:var(--mute);font-weight:500;margin-top:2px;line-height:1.4}
.row .side{flex:none;text-align:right;font-size:13px;color:var(--mute);white-space:nowrap}
.row .side b{display:block;color:var(--ink);font-family:Outfit;font-size:18px;line-height:1.2}
.wait{flex:none;width:54px;text-align:center;border-radius:12px;padding:5px 0 4px;color:#fff;font-family:Outfit;line-height:1}
.wait .num{font-size:23px;font-weight:800;display:block}
.wait small{font-size:10.5px;opacity:.92}
.w-s{background:var(--short)}.w-m{background:var(--mid)}.w-l{background:var(--long)}
.w-x{background:var(--soft);color:var(--mute)}
.w-x .num{font-size:14px;padding:5px 0 3px}
.star{flex:none;border:0;background:none;width:40px;height:44px;margin:-6px -8px -6px -10px;cursor:pointer;color:light-dark(#c7c6dc,#3d4170);font-size:21px;line-height:1}
.star[aria-pressed=true]{color:#f2b631}
details.more summary{list-style:none;cursor:pointer;padding:12px 14px;color:var(--mute);font-size:14px;font-weight:600;border-top:1px solid var(--line)}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ ";}
details.more[open] summary::before{content:"– "}

/* home: weather */
.wx{padding:12px 14px 10px}
.wxtop{display:flex;align-items:center;gap:10px}
.wxtop svg{width:34px;height:34px;color:var(--mid);flex:none}
.wxtop .num{font-size:32px;font-weight:700;line-height:1}
.wxtop .txt{font-size:13.5px;color:var(--mute);line-height:1.35}.wxtop .txt b{color:var(--ink);font-weight:600;font-size:15px}
.wxalert{font-size:14px;font-weight:600;color:var(--long);margin-top:6px}
.hours{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.hr{flex:1 0 44px;text-align:center;font-size:12px;color:var(--mute)}
.hr svg{width:20px;height:20px;display:block;margin:2px auto;color:var(--ink)}
.hr b{display:block;color:var(--ink);font-family:Outfit;font-size:14.5px}
.hr .p{color:var(--short);font-weight:600}.hr .p.hi{color:var(--long)}

/* home: event strip */
.evstrip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px 0}
.evstrip::-webkit-scrollbar{display:none}
.evstrip button{flex:none;border:0;cursor:pointer;background:var(--card);box-shadow:0 1px 0 var(--line);border-radius:14px;padding:9px 13px;text-align:left;font-size:13.5px;max-width:270px}
.evstrip button b{display:block;font-family:Outfit;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evstrip button span{color:var(--mute)}

/* home: park tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:900px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{border:0;text-align:left;cursor:pointer;background:var(--pc);color:#fff;border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:2px;min-height:128px;position:relative;overflow:hidden;box-shadow:0 6px 16px -10px var(--pc)}
.tile::after{content:"";position:absolute;right:-30px;top:-40px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,#ffffff30,#fff0 70%)}
.tile h3{margin:0;font-size:17px;line-height:1.15;font-weight:700}
.tile .st{font-size:13.5px;font-weight:600;opacity:.95}
.tile .sm{font-size:13px;opacity:.85;line-height:1.35}
.tile .big{margin-top:auto;display:flex;align-items:baseline;gap:6px;font-size:13px;opacity:.95}
.tile .big b{font-family:Outfit;font-size:24px;line-height:1}
.tile.closed{filter:saturate(.55)}

/* home: tonight */
.tl{display:grid;grid-template-columns:3.9em minmax(0,1fr);gap:0 10px;padding:8px 14px;border-top:1px solid var(--line);align-items:baseline}
.tl:first-of-type{border-top:0}
.tl b{font-family:Outfit;font-size:16px;white-space:nowrap}
.tl span{font-weight:600;line-height:1.3}
.tl small{display:block;color:var(--mute);font-weight:500;font-size:13px}

/* park page */
.hero{background:var(--pc);color:#fff;padding:14px 16px;position:relative;overflow:hidden;border-radius:18px}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#ffffff38,#fff0 70%);pointer-events:none}
.hero .hl{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero h2{margin:0;font-size:24px;line-height:1.1;font-weight:700}
.hero .wxm{position:relative;z-index:1;font-size:13px;font-weight:600;background:#00000029;border-radius:999px;padding:3px 10px;white-space:nowrap}
.hero .hrs{font-size:16px;font-weight:600;margin-top:4px}
.hero .sub{font-size:13.5px;opacity:.9;line-height:1.4}
.evchip{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:600;background:#ffffff2e;border-radius:999px;padding:2px 10px}
.marq{margin-top:10px;background:#00000029;border-radius:12px;padding:7px 12px}
.marq .m{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:2px 0;font-size:14.5px}
.marq .m b{font-family:Outfit;font-size:17px;white-space:nowrap}
.marq .m i{font-style:normal;opacity:.85;font-size:13.5px}
.gone{opacity:.5;text-decoration:line-through}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;margin:12px 0;box-shadow:0 1px 0 var(--line)}
.seg button{flex:1;border:0;background:none;border-radius:10px;min-height:42px;font-weight:600;color:var(--mute);cursor:pointer;font-size:15px;padding:0 4px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--pc,var(--accent));color:#fff}
.lw{display:none}@media(min-width:560px){.lw{display:inline}.ln{display:none}}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools input[type=search]{flex:1;font-size:16px;padding:10px 14px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.tog{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:44px;cursor:pointer;white-space:nowrap;font-weight:600}
.tog input{width:18px;height:18px;accent-color:var(--pc,var(--accent))}
.closedmsg{padding:18px 16px;color:var(--mute);text-align:center;font-size:15px}
.closedmsg b{display:block;color:var(--ink);font-family:Outfit;font-size:18px;margin-bottom:2px}
.times{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.t{font-family:Outfit;font-weight:600;font-size:14px;padding:2px 9px;border-radius:8px;background:var(--soft);white-space:nowrap}
.t.past{opacity:.38;text-decoration:line-through}
.t.next{background:var(--pc,var(--accent));color:#fff}
.hrsT{width:100%;border-collapse:collapse;font-size:15px}
.hrsT td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
.hrsT tr:first-child td{border-top:0}
.hrsT td:first-child{font-weight:600;width:36%}
.hrsT .x{display:block;color:var(--mute);font-size:13.5px}
.today td:first-child{color:var(--pc,var(--accent))}

/* events */
.evrow{padding:12px 14px;border-top:1px solid var(--line)}
.evrow:first-child{border-top:0}
.evrow h3{margin:0;font-size:16.5px;line-height:1.25}
.evrow .when{font-size:13.5px;color:var(--mute);margin-top:2px}
.evrow p{margin:5px 0 0;font-size:14.5px}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px;background:var(--soft);color:var(--mute);white-space:nowrap}
.pill.tix{background:light-dark(#fff0d6,#3a2e0c);color:light-dark(#8a5a00,#ffd98a)}

/* resorts */
details.res{border-top:1px solid var(--line)}
details.res:first-child{border-top:0}
details.res summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;min-height:56px}
details.res summary::-webkit-details-marker{display:none}
details.res summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);margin:-4px 4px 0 auto;flex:none;transition:transform .15s}
details.res[open] summary::after{transform:rotate(225deg);margin-top:4px}
details.res summary .nm{font-weight:600;line-height:1.25}
details.res summary small{display:block;color:var(--mute);font-weight:500;font-size:13.5px}
.dine{padding:0 14px 12px}
.dine h4{margin:8px 0 2px;font-size:13px;color:var(--mute);font-weight:600}
.dine ul{list-style:none;margin:0;padding:0}
.dine li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.dine li:first-child{border-top:0}
.dine li a{font-size:13.5px;color:var(--accent-ink);white-space:nowrap;text-decoration:none;font-weight:600;padding:8px 0}
</style>
</head>

<script>
{
const API='https://api.themeparks.wiki/v1';
const DEST='e957da41-3552-4cf6-b636-5babc5cbc4e5';
const TZ='America/New_York';
const WX_URL='https://api.open-meteo.com/v1/forecast?latitude=28.385&longitude=-81.564&current=temperature_2m,weather_code&hourly=temperature_2m,precipitation_probability,weather_code&daily=sunset,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=America%2FNew_York&forecast_days=2';
const PARKS=[
 {k:'mk',id:'75ea578a-adc8-4116-a54d-dccb60765ef9',ab:'MK',short:'Magic Kingdom',name:'Magic Kingdom',c:'#3f51d8',marquee:[{re:/^Happily Ever After/i,label:'Happily Ever After'},{re:/Dream the Night Away/i,label:'Dream the Night Away'}]},
 {k:'ep',id:'47f90d2c-e191-4239-a466-5892ef59a88b',ab:'EPCOT',short:'EPCOT',name:'EPCOT',c:'#8a3fc7',marquee:[{re:/^Luminous/i,label:'Luminous'}]},
 {k:'hs',id:'288747d1-8b4f-4a64-867e-ea7c9b27bad8',ab:'HS',short:'Hollywood Studios',name:'Hollywood Studios',c:'#c2364f',marquee:[{re:/^Fantasmic/i,label:'Fantasmic!'}]},
 {k:'ak',id:'1c84a229-8862-4648-9c71-378ddd2c7693',ab:'AK',short:'Animal Kingdom',name:'Animal Kingdom',c:'#1f7a5a',marquee:[{re:/^Tree of Life Awakenings/i,label:'Tree of Life Awakenings'}]},
 {k:'tl',id:'b070cbc5-feaa-4b87-a8c1-f94cca037a18',ab:'TL',short:'Typhoon Lagoon',name:'Typhoon Lagoon',c:'#0f86b5',marquee:[]},
 {k:'bb',id:'ead53ea5-22e5-4095-9a83-8c29300d7c63',ab:'BB',short:'Blizzard Beach',name:'Blizzard Beach',c:'#2b7fd0',marquee:[]}

    if(!st.live){const c=store.get('live',null);if(c){st.live=c.d;st.liveAt=c.at;indexLive()}}
    if(!Object.keys(st.sched).length){const c=store.get('sched',null);if(c){st.sched=c.d;st.schedAt=c.at}}
  }
  if(!st.wx){const c=store.get('wx',null);if(c){st.wx=c.d;st.wxAt=c.at}}
  btn.classList.remove('spin');render();
}

/* ---------- park data helpers ---------- */
const byPark=id=>(st.live||[]).filter(e=>e.parkId===id);
const schedOn=(id,date=today())=>(st.sched[id]||[]).filter(s=>s.date===date);
const cleanType=t=>({TICKETED_EVENT:'Ticketed event',EXTRA_HOURS:'Extra hours',INFO:'Info',CLOSED:'Closed'}[t]||t);
function hoursLine(id,date=today()){
  const s=schedOn(id,date);const op=s.find(x=>x.type==='OPERATING');
  const extras=s.filter(x=>x.type!=='OPERATING').map(x=>({ticketed:/special ticketed/i.test(x.description||''),label:/special ticketed/i.test(x.description||'')?eventName(id,x.date):(x.description||cleanType(x.type)),txt:`${fmtT(x.openingTime)}–${fmtT(x.closingTime)}`}));
  return {op,main:op?`${fmtT(op.openingTime)} – ${fmtT(op.closingTime)}`:(s.length?'':'Closed / not posted'),extras,purchases:op?.purchases||[]};
}
/* Name a "Special Ticketed Event": first from the park's party shows in the live feed ("… at Disney Jollywood Nights"),
   then from the EVENTS list by date, otherwise the generic label. */
function eventName(id,date){
  const p=parkOf(id);const norm=s=>s.toLowerCase().replace(/[’']/g,'');
  const fromFeed=[...new Set(byPark(id).map(e=>(String(e.name).match(/ at ((?:Disney |Mickey)[^]*?(?:Party|Nights?|Bash|After Hours))$/i)||[])[1]).filter(Boolean).map(cleanName))];
  const listed=EVENTS.find(e=>e.ticket&&e.park===p?.k&&e.start&&date>=e.start&&date<=e.end&&(!e.nights||e.nights.includes(date)));
  if(listed&&(!fromFeed.length||fromFeed.some(n=>norm(n)===norm(listed.name))))return listed.name;
  if(fromFeed.length===1)return fromFeed[0];
  return listed?.name||'Special Ticketed Event';
}
/* Open = inside regular hours, Early Entry or Extended Evening (not a separately ticketed party). */
const windows=id=>(st.sched[id]||[]).filter(x=>x.type==='OPERATING'||/early entry|extended evening/i.test(x.description||''));
function isOpen(id){const now=Date.now();return windows(id).some(x=>now>=+new Date(x.openingTime)&&now<+new Date(x.closingTime))}
function nextOpen(id){const now=Date.now();return (st.sched[id]||[]).filter(x=>x.type==='OPERATING'&&+new Date(x.openingTime)>now).sort((a,b)=>new Date(a.openingTime)-new Date(b.openingTime))[0]}
function nextOpenTxt(id,short=false){const n=nextOpen(id);if(!n)return '';const d=n.date===today()?'today':n.date===tomorrowYmd()?'tomorrow':dayName(n.date);return short?`Opens ${fmtT(n.openingTime)}${n.date===today()?'':' '+d}`:`Opens ${d} at ${fmtT(n.openingTime)}`}
const dur=ms=>{const m=Math.round(ms/60e3),h=Math.floor(m/60);return h?`${h}h ${m%60}m`:`${m}m`};
function openEnd(id){const now=Date.now();return Math.max(...windows(id).filter(x=>now>=+new Date(x.openingTime)&&now<+new Date(x.closingTime)).map(x=>+new Date(x.closingTime)))}
function openStatus(id){
  const {op}=hoursLine(id);const now=Date.now();
  if(isOpen(id))return `Open · closes in ${dur(openEnd(id)-now)}`;
  if(op&&now<+new Date(op.openingTime))return `Opens in ${dur(+new Date(op.openingTime)-now)}`;
  return 'Closed'+(nextOpenTxt(id)?' · '+nextOpenTxt(id):'');
}
function closeTime(id){const op=hoursLine(id).op;return op?+new Date(op.closingTime):0}
const wait=e=>e.queue?.STANDBY?.waitTime??null;
const rides=id=>byPark(id).filter(e=>e.entityType==='ATTRACTION');

/* ---------- ride timing from Disney's hourly forecast ---------- */
function fcNow(e){const now=Date.now();return (e.forecast||[]).find(x=>{const t=+new Date(x.time);return now>=t&&now<t+36e5})}
function belowUsual(e){
  const w=wait(e),f=fcNow(e);if(w==null||!f||f.waitTime==null||f.waitTime<20||e.status!=='OPERATING')return null;
  const save=f.waitTime-w;return save>=Math.max(10,f.waitTime*0.3)?{exp:f.waitTime,save}:null;
}
function bestLater(e){
  const w=wait(e);if(w==null||e.status!=='OPERATING')return null;
  const now=Date.now(),close=closeTime(e.parkId)||Infinity;
  const fut=(e.forecast||[]).filter(x=>x.waitTime!=null&&+new Date(x.time)>now&&+new Date(x.time)<close-30*60e3);
  if(!fut.length)return null;const best=fut.reduce((a,b)=>b.waitTime<a.waitTime?b:a);
  return best.waitTime<=w-15?best:null;
}
/* one muted line of facts under a ride name; highlights only what matters */
function rideFacts(e,{park=false}={}){
  const q=e.queue||{},out=[];const p=parkOf(e.parkId);
  if(park&&p)out.push(`<span><span class="dot" style="--pc:${p.c}"></span>${p.ab}</span>`);
  if(e.status==='DOWN')out.push('<span class="bad">Temporarily down</span>');
  else if(e.status==='REFURBISHMENT')out.push('Refurbishment');
  else if(e.status==='CLOSED')out.push('Closed');
  if(e.status==='OPERATING'){
    const b=belowUsual(e),l=bestLater(e);
    if(b)out.push(`<span class="good">Good time · usually ~${b.exp}</span>`);
    else if(l)out.push(`Better ~${l.waitTime} at ${fmtT(l.time)}`);
    const rt=q.RETURN_TIME,pr=q.PAID_RETURN_TIME,sr=q.SINGLE_RIDER,bg=q.BOARDING_GROUP;
    if(rt){if(rt.state==='AVAILABLE'&&rt.returnStart)out.push(`<span class="llc">LL ${fmtT(rt.returnStart)}</span>`);else if(rt.state==='FINISHED')out.push('LL gone');}
    if(pr){if(pr.state==='AVAILABLE'&&pr.returnStart)out.push(`<span class="llc">Single Pass ${fmtT(pr.returnStart)}${pr.price?.formatted?' · '+pr.price.formatted.replace('.00',''):''}</span>`);else if(pr.state==='FINISHED')out.push('Single Pass gone');}
    if(sr)out.push(sr.waitTime!=null?`Single rider ${sr.waitTime}m`:'Single rider');
    if(bg)out.push(`<span class="llc">Boarding group${bg.currentGroupStart?` ${bg.currentGroupStart}–${bg.currentGroupEnd}`:''}</span>`);
  }
  return out.length?`<span class="sub2">${out.join(' · ')}</span>`:'';
}
function waitBox(e){const w=wait(e),op=e.status==='OPERATING';return op&&w!=null?`<div class="wait ${wclass(w)}"><span class="num">${w}</span><small>min</small></div>`:`<div class="wait w-x"><span class="num">${op?'Open':e.status==='DOWN'?'Down':'—'}</span></div>`}
function rideRow(e,opt={}){
  const fav=st.favs.has(e.id);
  return `<div class="row"><button class="star" data-fav="${e.id}" aria-pressed="${fav}" aria-label="${fav?'Remove':'Add'} ${esc(cleanName(e.name))} ${fav?'from':'to'} favorites">★</button>
   <div class="nm">${esc(cleanName(e.name))}${rideFacts(e,opt)}</div>${waitBox(e)}</div>`;
}
function goodNow(parks){
  return parks.filter(p=>isOpen(p.id)).flatMap(p=>rides(p.id).filter(e=>belowUsual(e))).sort((a,b)=>belowUsual(b).save-belowUsual(a).save);
}

/* ---------- shows ---------- */
const isMeet=n=>/^(Meet|Greet)|Character|Meet /i.test(n);
const marqueeDef=(p,e)=>!/ at /i.test(e.name)&&(p.marquee||[]).find(m=>m.re.test(cleanName(e.name)));
function marquee(p){
  const ents=byPark(p.id).filter(e=>e.entityType==='SHOW');
  return (p.marquee||[]).map(m=>{
    const e=ents.find(x=>!/ at /i.test(x.name)&&m.re.test(cleanName(x.name)));
    const ts=(e?.showtimes||[]).filter(s=>ymd(new Date(s.startTime))===today()).map(s=>s.startTime).sort();
    return {label:m.label,ts};
  });
}
const partyTonight=p=>hoursLine(p.id).extras.some(x=>x.ticketed);
function shows(id,{meets=st.meets}={}){
  const p=parkOf(id);
  return byPark(id).filter(e=>e.entityType==='SHOW'&&(e.showtimes||[]).length&&(meets||!isMeet(e.name))&&!marqueeDef(p,e));
}
function marqueeBlock(p){
  const ms=marquee(p);if(!ms.length)return '';const now=Date.now();
  if(ms.every(m=>!m.ts.length)){const party=hoursLine(p.id).extras.find(x=>x.ticketed);return `<div class="marq"><div class="m"><i>${party?`No ${ms.length>1?'nighttime shows':esc(ms[0].label)} tonight · party night`:`No ${ms.length>1?'nighttime shows':esc(ms[0].label)} tonight`}</i></div></div>`}
  return `<div class="marq">${ms.map(m=>`<div class="m"><span>${esc(m.label)}</span>${m.ts.length?`<b>${m.ts.map(t=>`<span class="${+new Date(t)<now-20*60e3?'gone':''}">${fmtT(t)}</span>`).join(', ')}</b>`:`<i>${partyTonight(p)?'Not tonight · party night':'Not scheduled tonight'}</i>`}</div>`).join('')}</div>`;
}
const parklessShow=re=>(st.live||[]).find(e=>!e.parkId&&e.entityType==='SHOW'&&re.test(e.name));
function tonightItems(){
  const out=[];
  for(const p of THEME)for(const m of marquee(p))for(const t of m.ts)out.push({t,name:m.label,where:p.short,c:p.c});
  const ewp=parklessShow(/Electrical Water Pageant/i),dtl=parklessShow(/Drawn to Life/i);
  for(const [e,label,where] of [[ewp,'Electrical Water Pageant','Bay Lake & Seven Seas Lagoon'],[dtl,'Drawn to Life · Cirque du Soleil','Disney Springs']])
    for(const s of e?.showtimes||[])if(ymd(new Date(s.startTime))===today())out.push({t:s.startTime,name:label,where,c:'#7a7fae'});
  return out.sort((a,b)=>new Date(a.t)-new Date(b.t));
}

/* ---------- events ---------- */
const activeEvents=(k,date=today())=>EVENTS.filter(e=>e.start&&!e.ticket&&date>=e.start&&date<=e.end&&(k==null||e.park===k||e.park==='all'));
function eventNights(ev){
  const t=today();const p=parkByK(ev.park);
  if(ev.nights)return ev.nights.filter(d=>d>=t).map(d=>({date:d,txt:''}));
  if(!p)return [];
  return (st.sched[p.id]||[]).filter(x=>/special ticketed/i.test(x.description||'')&&x.date>=t&&x.date>=ev.start&&x.date<=ev.end&&eventName(p.id,x.date)===ev.name)
    .map(x=>({date:x.date,txt:`${fmtT(x.openingTime)}–${fmtT(x.closingTime)}`}));
}
function evWhen(ev){
  const t=today();if(ev.tba)return ev.tba;
  const range=`${shortDate(ev.start)} – ${shortDate(ev.end)}${ev.end.slice(0,4)!==t.slice(0,4)||ev.start.slice(0,4)!==ev.end.slice(0,4)?', '+ev.end.slice(0,4):''}`;
  if(t>=ev.start&&t<=ev.end){const left=daysBetween(t,ev.end);return `${range} · ${left===0?'last day today':left===1?'ends tomorrow':left+' days left'}`}
  if(t<ev.start){const n=daysBetween(t,ev.start);return `${range} · ${n===1?'starts tomorrow':'starts in '+n+' days'}`}
  return `${range} · ended`;
}

/* ---------- weather ---------- */
function wxIcon(code,isNight){const c=+code;const id=c===0||c===1?(isNight?'i-part':'i-sun'):c===2?'i-part':c===3?'i-cloud':c===45||c===48?'i-fog':c>=95?'i-storm':(c>=51&&c<=67)||(c>=80&&c<=82)?'i-rain':'i-cloud';return `<svg aria-hidden="true"><use href="#${id}"/></svg>`}
const wxWord=c=>{c=+c;return c===0?'Clear':c===1?'Mostly clear':c===2?'Partly cloudy':c===3?'Cloudy':c===45||c===48?'Fog':c>=95?'Thunderstorms':c>=80?'Showers':c>=61?'Rain':c>=51?'Drizzle':'Cloudy'};
const sunsetMs=()=>{const s=st.wx?.daily?.sunset?.[0];return s?+new Date(s+':00-05:00'):0};
function wxHours(n=10){
  const w=st.wx;if(!w?.hourly)return [];const now=Date.now();
  const out=[];w.hourly.time.forEach((t,i)=>{const ms=+new Date(t+':00-05:00');if(ms>now-36e5&&out.length<n)out.push({t:ms,temp:Math.round(w.hourly.temperature_2m[i]),p:w.hourly.precipitation_probability[i]??0,code:w.hourly.weather_code[i]})});
  return out;
}
function wxMini(){const w=st.wx;if(!w?.current)return '';const p=Math.max(0,...wxHours(3).map(h=>h.p));return `<span class="wxm">${Math.round(w.current.temperature_2m)}°${p>=30?` · ${p}% rain`:''}</span>`}
function weatherCard(){
  const w=st.wx;if(!w?.current)return '';
  const hrs=wxHours(10);const ss=sunsetMs();const night=ss&&Date.now()>ss;
  const wet=hrs.find(h=>h.p>=50);
  const hourLbl=ms=>new Date(ms).toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric'}).replace(' AM','a').replace(' PM','p');
  return `<section class="card wx">
    <div class="wxtop">${wxIcon(w.current.weather_code,night)}<span class="num">${Math.round(w.current.temperature_2m)}°</span>
      <div class="txt"><b>${wxWord(w.current.weather_code)}</b><br>High ${Math.round(w.daily.temperature_2m_max[0])}° · low ${Math.round(w.daily.temperature_2m_min[0])}°${ss?` · sunset ${fmtT(new Date(ss).toISOString())}`:''}</div></div>
    ${wet?`<div class="wxalert">Rain likely ${wet===hrs[0]?'now':'around '+hourLbl(wet.t)} (${wet.p}%)</div>`:''}
    <div class="hours">${hrs.map((h,i)=>`<div class="hr">${i===0?'Now':hourLbl(h.t)}${wxIcon(h.code,ss&&h.t>ss)}<b>${h.temp}°</b><span class="p${h.p>=50?' hi':''}">${h.p}%</span></div>`).join('')}</div>
  </section>`;
}

/* ---------- chrome ---------- */
const TABS=[['now','Right now','n-now'],['parks','Parks','n-parks'],['resorts','Resorts','n-resorts'],['events','Events','n-events']];

}
function stamp(){

  const m=Math.round((Date.now()-st.liveAt)/60e3);
  $('#stamp').textContent=(st.err?'Offline · ':'')+(m<1?'Live · updated just now':`Updated ${m} min ago`);

/* ---------- Right now ---------- */
function tile(p){
  const h=hoursLine(p.id);const open=isOpen(p.id);const now=Date.now();
  let status,mid='',big='';
  if(open){
    const end=openEnd(p.id);status=`Open until ${fmtT(new Date(end).toISOString())}`;
    const op=rides(p.id).filter(e=>e.status==='OPERATING');const ws=op.map(wait).filter(w=>w!=null);
    const avg=ws.length?Math.round(ws.reduce((a,b)=>a+b,0)/ws.length):null;
    big=avg!=null?`<b>${avg}</b>min avg wait`:`${op.length} rides open`;
  }else if(h.op&&now<+new Date(h.op.openingTime)){status=`Opens ${fmtT(h.op.openingTime)}`;big=`Today ${h.main}`}
  else{const n=nextOpen(p.id);status='Closed for the night';if(n){const nh=hoursLine(p.id,n.date);big=`${n.date===tomorrowYmd()?'Tomorrow':dayName(n.date).split(',')[0]} ${nh.main}`}}
  const nxt=marquee(p).flatMap(m=>m.ts.map(t=>({t,l:m.label}))).filter(x=>+new Date(x.t)>now-10*60e3).sort((a,b)=>new Date(a.t)-new Date(b.t))[0];
  const party=h.extras.find(x=>x.ticketed);
  if(nxt)mid=`${esc(nxt.l)} ${fmtT(nxt.t)}`;else if(party&&now<+new Date(h.op?.closingTime||0)+6*36e5)mid=`${esc(shortEv(party.label))} tonight`;
  return `<button class="tile${open?'':' closed'}" data-park="${p.k}" style="--pc:${p.c}"><h3>${p.name}</h3><span class="st">${status}</span>${mid?`<span class="sm">${mid}</span>`:''}<span class="big">${big}</span></button>`;
}
function eventStrip(){
  const t=today();const items=[];
  for(const e of EVENTS.filter(e=>e.start&&!e.ticket&&t>=e.start&&t<=e.end))items.push({b:shortEv(e.name),s:`Through ${shortDate(e.end)}`});
  for(const p of THEME)for(const x of hoursLine(p.id).extras.filter(x=>x.ticketed))items.push({b:x.label,s:`Tonight ${x.txt} · ${p.ab}`});
  const next=EVENTS.filter(e=>e.start&&e.start>t).sort((a,b)=>a.start<b.start?-1:1)[0];
  if(next)items.push({b:shortEv(next.name),s:evWhen(next).split(' · ')[1]});
  return items.length?`<div class="evstrip">${items.map(i=>`<button data-v="events"><b>${esc(i.b)}</b><span>${esc(i.s)}</span></button>`).join('')}</div>`:'';
}
function tonightCard(){
  const now=Date.now();const items=tonightItems().filter(i=>+new Date(i.t)>now-20*60e3);
  if(!items.length)return '';
  return `<section class="card"><div class="ch"><h2>Tonight</h2><span>Shows across the resort</span></div>${items.map(i=>`<div class="tl"><b>${fmtT(i.t)}</b><span>${esc(i.name)}<small><span class="dot" style="--pc:${i.c}"></span>${esc(i.where)}</small></span></div>`).join('')}</section>`;
}
function favCard(){
  const open=THEME.filter(p=>isOpen(p.id));
  const favs=open.flatMap(p=>rides(p.id).filter(e=>st.favs.has(e.id))).sort((a,b)=>(wait(a)??999)-(wait(b)??999));
  if(!open.length)return '';
  return `<section class="card"><div class="ch"><h2>Your favorites</h2><span>${favs.length?'Shortest wait first':''}</span></div>${favs.length?favs.map(e=>rideRow(e,{park:true})).join(''):'<div class="hint">Tap ★ next to any ride and it will show up here with its live wait.</div>'}</section>`;
}
function goodCard(){
  const good=goodNow(THEME).slice(0,5);if(!good.length)return '';
  return `<section class="card"><div class="ch"><h2>Good time to ride</h2><span>Shorter than usual now</span></div>${good.map(e=>rideRow(e,{park:true})).join('')}</section>`;

function homeView(){
  return `${weatherCard()}${eventStrip()}<div class="tiles">${THEME.map(tile).join('')}</div>
    <div class="grid" style="margin-top:14px">${favCard()}${goodCard()}${tonightCard()}</div>`;
}

/* ---------- Parks ---------- */
function hero(p){

  return `<div class="hero" style="--pc:${p.c}">
    <div class="hl"><h2>${p.name}</h2>${wxMini()}</div>

    ${h.extras.length||!h.op?`<div class="sub">${!h.op?openStatus(p.id)+(h.extras.length?' · ':''):''}${h.extras.map(x=>`${esc(x.label)} ${x.txt}`).join(' · ')}</div>`:''}

const closedMsg=p=>`<div class="closedmsg"><b>Park closed</b>Ride times will appear when ${p.name} opens.${nextOpenTxt(p.id)?' '+nextOpenTxt(p.id)+'.':''}</div>`;
function ridesView(p){
  if(!isOpen(p.id))return `<div class="card">${closedMsg(p)}</div>`;
  let all=rides(p.id);
  if(st.q)all=all.filter(e=>e.name.toLowerCase().includes(st.q));
  const cmp=st.sort==='wait'?(a,b)=>(wait(b)??-1)-(wait(a)??-1)||a.name.localeCompare(b.name):(a,b)=>cleanName(a.name).localeCompare(cleanName(b.name));
  const live=all.filter(e=>e.status==='OPERATING'||e.status==='DOWN');const closed=all.filter(e=>!live.includes(e)).sort((a,b)=>cleanName(a.name).localeCompare(cleanName(b.name)));
  const favs=live.filter(e=>st.favs.has(e.id)).sort(cmp),rest=live.filter(e=>!st.favs.has(e.id)).sort(cmp);
  const good=st.q?[]:goodNow([p]).filter(e=>!st.favs.has(e.id)).slice(0,4);
  return `<div class="tools"><input type="search" id="q" placeholder="Search rides" value="${esc(st.q)}" autocomplete="off" aria-label="Search rides">
    <button class="tog" id="sort" aria-label="Change sort order">${st.sort==='wait'?'Longest first':'A–Z'}</button></div>
    ${favs.length?`<div class="sect">Your favorites</div><div class="card">${favs.map(e=>rideRow(e)).join('')}</div>`:''}
    ${good.length?`<div class="sect">Good time to ride</div><div class="card">${good.map(e=>rideRow(e)).join('')}</div>`:''}
    <div class="sect">${favs.length||good.length?'All rides':'Rides'}</div>
    <div class="card">${rest.length?rest.map(e=>rideRow(e)).join(''):'<div class="empty">Nothing matches.</div>'}
    ${closed.length?`<details class="more"><summary>Closed today (${closed.length})</summary>${closed.map(e=>rideRow(e)).join('')}</details>`:''}</div>`;
}
function llView(p){
  const h=hoursLine(p.id);const pur=h.purchases;
  const pkg=pur.filter(x=>x.type==='PACKAGE');const singles=pur.filter(x=>x.type==='ATTRACTION');
  const rs=rides(p.id);
  const findRide=nm=>{const n=cleanName(nm.replace(/^Lightning Lane for /i,'')).toLowerCase();return rs.find(e=>cleanName(e.name).toLowerCase()===n)||rs.find(e=>cleanName(e.name).toLowerCase().includes(n)||n.includes(cleanName(e.name).toLowerCase()))};
  const tomorrow=hoursLine(p.id,tomorrowYmd()).purchases.filter(x=>x.type==='PACKAGE');
  const mp=rs.filter(e=>e.queue?.RETURN_TIME);
  const avail=mp.filter(e=>e.queue.RETURN_TIME.state==='AVAILABLE'&&e.queue.RETURN_TIME.returnStart).sort((a,b)=>new Date(a.queue.RETURN_TIME.returnStart)-new Date(b.queue.RETURN_TIME.returnStart));
  const gone=mp.filter(e=>!avail.includes(e));
  const price=x=>(x.price?.formatted||'—').replace('.00','');
  const mpRow=(lbl,x,soldTxt)=>`<div class="row"><div class="nm">${lbl}<span class="sub2">${x.available===false?'<span class="bad">Sold out</span>':soldTxt}</span></div><div class="side"><b>${price(x)}</b>per person</div></div>`;
  return `<div class="sect">Multi Pass</div><div class="card">
    ${pkg.length?pkg.map(x=>mpRow('Today',x,'<span class="good">Available</span>')).join(''):'<div class="empty">No Multi Pass price posted for today.</div>'}
    ${tomorrow.map(x=>mpRow('Tomorrow',x,'On sale')).join('')}</div>
  ${singles.length?`<div class="sect">Single Pass</div><div class="card">${singles.map(x=>{const r=findRide(x.name);const pr=r?.queue?.PAID_RETURN_TIME;const sold=x.available===false||pr?.state==='FINISHED';const ret=pr?.state==='AVAILABLE'&&pr.returnStart?`Next return ${fmtT(pr.returnStart)}`:'Available';
    return `<div class="row"><div class="nm">${esc(cleanName(x.name.replace(/^Lightning Lane for /i,'')))}<span class="sub2">${sold?'<span class="bad">Sold out</span>':`<span class="good">${ret}</span>`}${r&&wait(r)!=null?` · standby ${wait(r)} min`:''}</span></div><div class="side"><b>${price(x)}</b>per person</div></div>`}).join('')}</div>`:''}
  <div class="sect">Multi Pass return times</div><div class="card">
    ${avail.length?avail.map(e=>`<div class="row"><div class="nm">${esc(cleanName(e.name))}${wait(e)!=null?`<span class="sub2">Standby ${wait(e)} min</span>`:''}</div><div class="side"><b>${fmtT(e.queue.RETURN_TIME.returnStart)}</b>next return</div></div>`).join(''):`<div class="empty">${isOpen(p.id)?'No return times available right now.':'Return times appear once the park opens.'}</div>`}
    ${gone.length?`<div class="note">Gone for today: ${gone.map(e=>esc(cleanName(e.name))).join(', ')}</div>`:''}
  </div>
  <p class="foot">Buy and book in the My Disney Experience app. Prices are per person, before tax.</p>`;
}
function showsView(p){
  const now=Date.now();
  let list=shows(p.id).filter(e=>!st.q||e.name.toLowerCase().includes(st.q)).map(e=>{
    const ts=[...e.showtimes].sort((a,b)=>new Date(a.startTime)-new Date(b.startTime));
    const nxt=ts.find(s=>+new Date(s.endTime||s.startTime)>=now);
    return {e,ts,nxt};
  });
  list.sort((a,b)=>(a.nxt?0:1)-(b.nxt?0:1)||(a.nxt&&b.nxt?new Date(a.nxt.startTime)-new Date(b.nxt.startTime):0)||a.e.name.localeCompare(b.e.name));
  const upcoming=list.filter(x=>x.nxt),done=list.filter(x=>!x.nxt);
  const row=({e,ts,nxt})=>{
    const range=ts.every(s=>s.type!=='Performance Time');
    const fut=nxt?ts.filter(s=>+new Date(s.endTime||s.startTime)>=now):ts;
    const chips=fut.map(s=>{const isN=s===nxt;const lbl=range?`${fmtT(s.startTime)}–${fmtT(s.endTime)}`:fmtT(s.startTime);
      return `<span class="t${isN?' next':nxt?'':' past'}">${lbl}</span>`}).join('');
    return `<div class="row"><div class="nm">${esc(cleanName(e.name))}<div class="times">${chips}</div></div></div>`;
  };
  return `<div class="tools"><input type="search" id="q" placeholder="Search shows" value="${esc(st.q)}" autocomplete="off" aria-label="Search shows">
    <label class="tog"><input type="checkbox" id="meets" ${st.meets?'checked':''}> Characters</label></div>
    <div class="card">${upcoming.length?upcoming.map(row).join(''):'<div class="empty">No more shows today.</div>'}
    ${done.length?`<details class="more"><summary>Finished for today (${done.length})</summary>${done.map(row).join('')}</details>`:''}</div>
    <p class="foot">The nighttime spectacular is at the top of the page.</p>`;
}
function hoursView(list){
  const days=[...new Set(list.flatMap(p=>(st.sched[p.id]||[]).map(s=>s.date)))].sort().filter(d=>d>=today()).slice(0,10);
  return list.map(p=>`<div class="sect">${list.length>1?p.name:'Next 10 days'}</div><div class="card" style="--pc:${p.c}"><table class="hrsT"><tbody>${days.map(d=>{
    const h=hoursLine(p.id,d);const pass=h.purchases.find(x=>x.type==='PACKAGE');const evs=activeEvents(p.k,d).filter(e=>e.park===p.k);
    return `<tr class="${d===today()?'today':''}"><td>${d===today()?'Today':dayName(d)}</td><td>${h.main||'—'}${h.extras.map(x=>`<span class="x">${esc(x.label)} ${x.txt}</span>`).join('')}${d===today()?marquee(p).filter(m=>m.ts.length).map(m=>`<span class="x">${esc(m.label)} ${m.ts.map(fmtT).join(', ')}</span>`).join(''):''}${evs.map(e=>`<span class="x">${esc(shortEv(e.name))}</span>`).join('')}${pass?.price?`<span class="x">Multi Pass ${pass.price.formatted.replace('.00','')}${pass.available===false?' (sold out)':''}</span>`:''}</td></tr>`}).join('')}</tbody></table></div>`).join('');
}
function waterView(){
  return WATER.map(p=>{const open=isOpen(p.id);const rs=rides(p.id).filter(e=>e.status==='OPERATING'||e.status==='DOWN').sort((a,b)=>(wait(b)??-1)-(wait(a)??-1));
    return `<div style="margin-bottom:14px">${hero(p)}</div>${open?`<div class="card" style="margin-bottom:14px">${rs.length?rs.map(e=>rideRow(e)).join(''):'<div class="empty">No wait times posted.</div>'}</div>`:''}`}).join('')+hoursView(WATER);
}
function parksView(){
  if(st.park==='water')return waterView();
  const p=parkByK(st.park)||THEME[0];
  const tabs=[['rides','Rides'],['ll','<span class="lw">Lightning Lane</span><span class="ln">Lightning</span>'],['shows','Shows'],['hours','Hours']];
  if(!tabs.some(([k])=>k===st.tab))st.tab='rides';
  return `${hero(p)}
    <div class="seg" style="--pc:${p.c}" role="tablist">${tabs.map(([k,l])=>`<button data-tab="${k}" role="tab" aria-pressed="${st.tab===k}">${l}</button>`).join('')}</div>
    <div style="--pc:${p.c}">${st.tab==='rides'?ridesView(p):st.tab==='ll'?llView(p):st.tab==='shows'?showsView(p):hoursView([p])}</div>`;
}

/* ---------- Resorts ---------- */
function resortsView(){
  const q=st.rq;const now=Date.now();
  const ewp=parklessShow(/Electrical Water Pageant/i),dtl=parklessShow(/Drawn to Life/i);
  const dsRides=(st.live||[]).filter(e=>!e.parkId&&e.entityType==='ATTRACTION'&&/Aerophile|Amphicar|Carousel|Train Express/i.test(e.name));
  const tchips=e=>(e?.showtimes||[]).filter(s=>ymd(new Date(s.startTime))===today()).map(s=>`<span class="t${+new Date(s.startTime)<now?' past':' next'}">${fmtT(s.startTime)}</span>`).join('')||'<span class="tag">Not scheduled tonight</span>';
  const isLounge=n=>/Lounge|Pool Bar|Grotto|Tiki|Libations|Margaritas|Spirits|Grogs|AbracadaBar|Cove Bar|Stargazers|Belle Vue|Cantina|Laguna Bar|Wine Bar$|Hangar Bar|Tavern|Sand Bar|Chill|Stir|Hurly/i.test(n)&&!/Restaurant|Grill|Dining/i.test(n);
  const walkup=id=>{const e=st.liveById[id];if(!e)return '';const w=e.queue?.STANDBY?.waitTime??(e.diningAvailability||[]).find(d=>d.partySize===2)?.waitTime;return w!=null?` <span class="tag good">Walk-up ~${w} min</span>`:''};
  const item=(r,[id,n])=>`<li><span>${esc(cleanName(n))}${walkup(id)}</span><a href="https://www.google.com/search?q=${encodeURIComponent(cleanName(n)+' '+r.name+' Disney World menu')}" target="_blank" rel="noopener">Menu ↗</a></li>`;
  const resorts=RESORTS.map(r=>({...r,items:q?r.items.filter(([,n])=>n.toLowerCase().includes(q)||r.name.toLowerCase().includes(q)):r.items})).filter(r=>r.items.length);
  const groups=RES_GROUPS.map(([g,label])=>({label,rs:resorts.filter(r=>r.g===g)})).filter(x=>x.rs.length);
  return `<div class="tools"><input type="search" id="rq" placeholder="Find a resort, restaurant or lounge" value="${esc(q)}" autocomplete="off" aria-label="Search resorts and dining"></div>
   ${q?'':`<div class="sect">Tonight around the resorts</div><div class="card">
     <div class="row"><div class="nm">Electrical Water Pageant<span class="sub2">Floats past the monorail resorts, Wilderness Lodge and Fort Wilderness</span><div class="times">${tchips(ewp)}</div></div></div>
     <div class="row"><div class="nm">Drawn to Life · Cirque du Soleil<span class="sub2">Disney Springs · separate ticket</span><div class="times">${tchips(dtl)}</div></div></div>
     ${dsRides.length?`<div class="row"><div class="nm">Disney Springs rides<span class="sub2">${dsRides.map(e=>`${esc(cleanName(e.name).replace(/ – .*/,'').replace(/^Marketplace /,''))} <span class="${e.status==='OPERATING'?'good':e.status==='DOWN'?'bad':''}">${e.status==='OPERATING'?'open':e.status==='DOWN'?'down':'closed'}</span>`).join(' · ')}</span></div></div>`:''}
   </div>`}
   ${groups.length?groups.map(g=>`<div class="sect">${g.label}</div><div class="card">${g.rs.map(r=>{
      const din=r.items.filter(([,n])=>!isLounge(n)),lo=r.items.filter(([,n])=>isLounge(n));
      return `<details class="res" data-r="${esc(r.name)}"${q||st.openRes.has(r.name)?' open':''}><summary><span class="nm">${esc(r.name)}<small>${esc(r.tr)}</small></span></summary><div class="dine">
        ${din.length?`<h4>Dining</h4><ul>${din.map(x=>item(r,x)).join('')}</ul>`:''}${lo.length?`<h4>Lounges & bars</h4><ul>${lo.map(x=>item(r,x)).join('')}</ul>`:''}</div></details>`}).join('')}</div>`).join(''):'<div class="card"><div class="empty">Nothing matches.</div></div>'}
   <p class="foot">Menu links search for Disney’s menu page. Reservations are in the My Disney Experience app.</p>`;
}

/* ---------- Events ---------- */
function eventsView(){
  const t=today();
  const now=EVENTS.filter(e=>e.start&&t>=e.start&&t<=e.end).sort((a,b)=>a.end<b.end?-1:1);
  const soon=EVENTS.filter(e=>e.start&&t<e.start).sort((a,b)=>a.start<b.start?-1:1);
  const tba=EVENTS.filter(e=>e.tba);
  const where=e=>e.park==='all'?'All parks & resorts':parkByK(e.park)?.name||'';
  const row=e=>{const p=parkByK(e.park);const nights=e.ticket&&e.start?eventNights(e):[];
    return `<div class="evrow" style="--pc:${p?.c||'#5b4bdb'}"><h3>${esc(e.name)}${e.ticket?'<span class="pill tix">Separate ticket</span>':''}</h3>
      <div class="when">${p?`<span class="dot"></span>`:''}${esc(where(e))} · ${esc(evWhen(e))}</div><p>${esc(e.blurb)}</p>
      ${nights.length?`<div class="times">${nights.slice(0,6).map(n=>`<span class="t${n.date===t?' next':''}">${n.date===t?'Tonight':dayName(n.date)}${n.txt?' · '+n.txt:''}</span>`).join('')}${nights.length>6?`<span class="tag">+${nights.length-6} more</span>`:''}</div>`:''}</div>`};
  return `${now.length?`<div class="sect">Happening now</div><div class="card">${now.map(row).join('')}</div>`:''}
    ${soon.length?`<div class="sect">Coming up</div><div class="card">${soon.map(row).join('')}</div>`:''}
    ${tba.length?`<div class="sect">Dates not announced yet</div><div class="card">${tba.map(row).join('')}</div>`:''}
    <p class="foot">Everything is included with park admission unless marked “Separate ticket.” Party nights come from Disney’s live park calendar; festival dates as announced by Disney, last checked Nov 25, 2026.</p>`;
}

/* ---------- render ---------- */
function render(){
  chrome();stamp();
  document.querySelectorAll('details.res').forEach(d=>d.open?st.openRes.add(d.dataset.r):st.openRes.delete(d.dataset.r));
  const m=$('#main');const banner=st.err?`<div class="banner">${esc(st.err)}</div>`:'';
  if(!st.live){m.innerHTML=banner+'<div class="empty">Loading live park data…</div>';return}
  const focusId=document.activeElement?.id;
  const body=st.view==='now'?homeView():st.view==='parks'?parksView():st.view==='resorts'?resortsView():eventsView();
  m.innerHTML=banner+body+`<p class="foot">Live data from <a href="https://themeparks.wiki" target="_blank" rel="noopener">ThemeParks.wiki</a> · weather from <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> · refreshes every 5 min · Orlando time<br>Unofficial — not affiliated with Disney.</p>`;
  if(focusId==='q'||focusId==='rq'){const q=document.getElementById(focusId);if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
}
function go(v,parkK){
  if(parkK){st.park=parkK;store.set('park',parkK);v='parks'}
  if(v!==st.view||parkK){st.q='';window.scrollTo(0,0)}
  st.view=v;store.set('view',v);render();
}

/* ---------- interactions ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-v],[data-park],[data-tab],[data-fav],#sort,#refresh');if(!t)return;
  if(t.dataset.park)go('parks',t.dataset.park);
  else if(t.dataset.v)go(t.dataset.v);
  else if(t.dataset.tab){st.tab=t.dataset.tab;st.q='';store.set('tab',st.tab);render()}
  else if(t.dataset.fav){const id=t.dataset.fav;st.favs.has(id)?st.favs.delete(id):st.favs.add(id);store.set('favs',[...st.favs]);render()}
  else if(t.id==='sort'){st.sort=st.sort==='wait'?'name':'wait';store.set('sort',st.sort);render()}
  else if(t.id==='refresh'){load(true)}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){st.q=ev.target.value.trim().toLowerCase();render()}
  if(ev.target.id==='rq'){st.rq=ev.target.value.trim().toLowerCase();render()}
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='meets'){st.meets=ev.target.checked;store.set('meets',st.meets);render()}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(false)});
setInterval(()=>{if(!document.hidden)load(false)},60e3);
setInterval(stamp,30e3);
render();load(true);
}
</script>
</body>
</html>
