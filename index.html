<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bret and Nicole WDW Park Board">
<meta name="theme-color" content="#1b1f4a">
<title>Bret and Nicole WDW Park Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly, glanceable, built to be checked twenty times a day in a queue.
   IDEA: the in-park tip board — big wait numbers on a lit board, one per park.
   PICTURE: the board itself — each park gets a coloured header band with hours and tonight's spectacular.
   COLOUR and TYPE: midnight-indigo chrome, per-park accents, wait pills on a teal→gold→coral heat scale; Outfit numerals + Inter.
   LAYOUT: sticky header + chips, then the board; single column on phones, two or three columns on wide screens. */
:root{color-scheme:light dark;
--bg:light-dark(#f4f3fb,#0d0f24);--card:light-dark(#ffffff,#171a38);--ink:light-dark(#171a3a,#eef0ff);
--mute:light-dark(#5e6288,#a3a8d4);--line:light-dark(#e3e2f2,#272b55);--chrome:#1b1f4a;--soft:light-dark(#eeedf8,#232750);
--short:light-dark(#0f8f86,#2fc7b9);--mid:light-dark(#b07a00,#f2b631);--long:light-dark(#d2453a,#ff7a6b);
--accent:#5b4bdb}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,.num{font-family:Outfit,system-ui,sans-serif}
button{font:inherit;color:inherit}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--chrome);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) max(4vw,14px) 0}
.bar{display:flex;align-items:center;gap:10px;max-width:1240px;margin:auto}
.bar h1{font-size:19px;line-height:1.15;margin:0;font-weight:700;letter-spacing:.2px;flex:1}.bar h1 span{white-space:nowrap}
.stamp{font-size:13px;color:#c9ccf5;white-space:nowrap}
.refresh{background:#ffffff1f;border:0;border-radius:999px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;flex:none}
.refresh svg{width:20px;height:20px}
.refresh.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.refresh.spin svg{animation:none}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;max-width:1240px;margin:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:10px 16px;min-height:44px;background:#ffffff14;color:#e6e8ff;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:#fff;color:var(--chrome)}
.chip:focus-visible,.seg button:focus-visible,.refresh:focus-visible,.star:focus-visible,.tog:focus-visible,summary:focus-visible{outline:3px solid #ffd76a;outline-offset:2px}
main{max-width:1240px;margin:auto;padding:16px max(4vw,14px) 40px}
.banner{background:light-dark(#fff3d6,#3a2e0c);color:light-dark(#6b4a00,#ffd98a);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px;align-items:start}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 6px 20px -12px #1b1f4a55}
.hero{background:var(--pc);color:#fff;padding:18px 18px 16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#ffffff38,#fff0 70%);pointer-events:none}
.hero h2{margin:0;font-size:clamp(24px,6vw,34px);line-height:1.05;font-weight:700;text-wrap:balance}
.hero .hrs{font-size:17px;margin-top:6px;font-weight:600}
.hero .sub{font-size:14px;opacity:.88;margin-top:2px}
.hero .wx{position:absolute;top:16px;right:16px;z-index:1;font-size:13px;font-weight:600;background:#00000029;border-radius:999px;padding:4px 10px;white-space:nowrap}
.evchip{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;background:#ffffff2e;border-radius:999px;padding:3px 10px}
.marq{margin-top:12px;background:#00000029;border-radius:12px;padding:10px 12px}
.marq .lbl{font-size:12.5px;opacity:.85;font-weight:600;margin-bottom:2px}
.marq .m{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:3px 0;font-size:15px}
.marq .m b{font-family:Outfit;font-size:19px;white-space:nowrap}
.marq .m i{font-style:normal;opacity:.8;font-size:14px;white-space:nowrap}
.gone{opacity:.5;text-decoration:line-through}
.closed{padding:18px 16px;color:var(--mute);text-align:center;font-size:15px}
.closed b{display:block;color:var(--ink);font-family:Outfit;font-size:19px;margin-bottom:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.stats div{padding:12px 14px}.stats div+div{border-left:1px solid var(--line)}
.stats .num{font-size:26px;font-weight:700;line-height:1.1}
.stats small{display:block;color:var(--mute);font-size:13px}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;margin:14px 0;box-shadow:0 1px 0 var(--line)}
.seg button{flex:1;border:0;background:none;border-radius:10px;min-height:44px;font-weight:600;color:var(--mute);cursor:pointer;font-size:15px;padding:0 4px}
.lw{display:none}@media(min-width:560px){.lw{display:inline}.ln{display:none}}
.seg button[aria-pressed=true]{background:var(--pc,var(--accent));color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools input[type=search]{flex:1 1 200px;font-size:16px;padding:10px 14px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.tog{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:44px;cursor:pointer;white-space:nowrap;text-decoration:none}
.tog input{width:18px;height:18px;accent-color:var(--pc,var(--accent))}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .nm{flex:1;font-weight:600;line-height:1.3}
.row .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;font-weight:500}
.row .side{flex:none;text-align:right;font-size:14px;color:var(--mute);white-space:nowrap}
.row .side b{display:block;color:var(--ink);font-family:Outfit;font-size:18px}
.tag{font-size:12.5px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--mute);white-space:nowrap}
.tag.ll{background:light-dark(#e8e4ff,#2c2766);color:light-dark(#4a3bc4,#c4bbff)}
.tag.down{background:light-dark(#ffe3df,#4a1d1a);color:var(--long)}
.tag.good{background:light-dark(#dcf5f2,#123b38);color:var(--short)}
.tag.park{color:#fff;background:var(--pc)}
.wait{flex:none;width:62px;text-align:center;border-radius:12px;padding:6px 0 4px;color:#fff;font-family:Outfit;line-height:1}
.wait .num{font-size:26px;font-weight:800;display:block}
.wait small{font-size:11px;opacity:.9}
.w-s{background:var(--short)}.w-m{background:var(--mid)}.w-l{background:var(--long)}
.w-x{background:light-dark(#d9d8ea,#2a2e57);color:var(--mute)}
.w-x .num{font-size:15px;padding:5px 0 3px}
.star{flex:none;border:0;background:none;width:36px;height:44px;margin:-6px -4px -6px -8px;cursor:pointer;color:light-dark(#c7c6dc,#3d4170);font-size:22px;line-height:1}
.star[aria-pressed=true]{color:#f2b631}
.times{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.t{font-family:Outfit;font-weight:600;font-size:14px;padding:3px 9px;border-radius:8px;background:var(--soft);white-space:nowrap}
.t.past{opacity:.38;text-decoration:line-through}
.t.next{background:var(--pc,var(--accent));color:#fff}
.sect{font-family:Outfit;font-size:15px;font-weight:700;color:var(--mute);margin:18px 2px 8px}
.sect:first-child{margin-top:0}
.note{font-size:13.5px;color:var(--mute);padding:10px 14px;border-top:1px solid var(--line)}
.hrsT{width:100%;border-collapse:collapse;font-size:15px}
.hrsT td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top}
.hrsT tr:first-child td{border-top:0}
.hrsT td:first-child{font-weight:600;width:38%}
.hrsT .x{display:block;color:var(--mute);font-size:13.5px}
.today td:first-child{color:var(--pc,var(--accent))}
.empty{padding:22px 16px;color:var(--mute);text-align:center}
.foot{color:var(--mute);font-size:13px;text-align:center;margin-top:26px}
.click{cursor:pointer}
/* weather */
.wxcard{padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center}
.wxnow{display:flex;align-items:center;gap:10px}
.wxnow svg{width:44px;height:44px;color:var(--mid)}
.wxnow .num{font-size:40px;font-weight:700;line-height:1}
.wxtxt{font-size:14px;color:var(--mute)}.wxtxt b{color:var(--ink);font-weight:600;display:block;font-size:15px}
.hours{grid-column:1/-1;display:flex;gap:4px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.hr{flex:1 0 46px;text-align:center;font-size:12.5px;color:var(--mute);border-radius:10px;padding:6px 2px}
.hr svg{width:22px;height:22px;display:block;margin:2px auto;color:var(--ink)}
.hr b{display:block;color:var(--ink);font-family:Outfit;font-size:15px}
.hr .p{color:var(--short);font-weight:600}.hr .p.hi{color:var(--long)}
.wxalert{grid-column:1/-1;font-size:14px;font-weight:600;color:var(--long);margin-top:4px}
/* events */
.evrow{padding:12px 14px;border-top:1px solid var(--line)}
.evrow:first-child{border-top:0}
.evrow h3{margin:0;font-size:17px;line-height:1.25}
.evrow .when{font-size:14px;color:var(--mute);margin-top:2px}
.evrow p{margin:6px 0 0;font-size:14.5px}
.evrow .times{margin-top:8px}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px;background:var(--soft);color:var(--mute);white-space:nowrap}
.pill.tix{background:light-dark(#fff0d6,#3a2e0c);color:light-dark(#8a5a00,#ffd98a)}
.pill.now{background:light-dark(#dcf5f2,#123b38);color:var(--short)}
.evstrip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.evstrip::-webkit-scrollbar{display:none}
.evstrip button{flex:none;border:0;cursor:pointer;background:var(--card);box-shadow:0 1px 0 var(--line);border-radius:14px;padding:10px 14px;text-align:left;font-size:14px;max-width:290px}
.evstrip button b{display:block;font-family:Outfit;font-size:15.5px;line-height:1.2}
.evstrip button span{color:var(--mute)}
/* resorts */
details.res{border-top:1px solid var(--line)}
details.res:first-child{border-top:0}
details.res summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;min-height:56px}
details.res summary::-webkit-details-marker{display:none}
details.res summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);margin:-4px 4px 0 auto;flex:none;transition:transform .15s}
details.res[open] summary::after{transform:rotate(225deg);margin-top:4px}
details.res summary .nm{font-weight:600;line-height:1.25}
details.res summary small{display:block;color:var(--mute);font-weight:500;font-size:13.5px}
.dine{padding:0 14px 12px}
.dine h4{margin:8px 0 2px;font-size:13px;color:var(--mute);font-weight:600}
.dine ul{list-style:none;margin:0;padding:0}
.dine li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.dine li:first-child{border-top:0}
.dine li a{font-size:13.5px;color:var(--accent);white-space:nowrap;text-decoration:none;font-weight:600;padding:6px 0}
:root{--accent-ink:light-dark(#4a3bc4,#b9b0ff)}.dine li a{color:var(--accent-ink)}
.tl{display:grid;grid-template-columns:4.1em minmax(0,1fr);gap:2px 12px;padding:10px 14px;border-top:1px solid var(--line);align-items:baseline}
.tl:first-child{border-top:0}
.tl b{font-family:Outfit;font-size:17px;white-space:nowrap}
.tl span{font-weight:600;line-height:1.3}
.tl .tag{grid-column:2;justify-self:start;margin-top:2px}
.tl.past{opacity:.45}
</style>
</head>

const fmtT=iso=>iso?new Date(iso).toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'}).replace(':00','').replace(' AM','a').replace(' PM','p'):'';
const ymd=d=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
const today=()=>ymd(new Date());

const shortDate=s=>new Date(s+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});

async function getJSON(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}
function indexLive(){st.liveById={};for(const e of st.live||[])st.liveById[e.id]=e}
async function load(force){
  const btn=$('#refresh');btn.classList.add('spin');
  const now=Date.now();
  try{
    const jobs=[];
    if(force||now-st.liveAt>LIVE_MS-5e3)jobs.push(getJSON(`${API}/entity/${DEST}/live`).then(d=>{st.live=d.liveData||[];st.liveAt=Date.now();indexLive();store.set('live',{at:st.liveAt,d:st.live})}));
    if(force||now-st.schedAt>SCHED_MS)jobs.push(Promise.all(PARKS.map(p=>getJSON(`${API}/entity/${p.id}/schedule`).then(d=>{st.sched[p.id]=d.schedule||[]}))).then(()=>{st.schedAt=Date.now();store.set('sched',{at:st.schedAt,d:st.sched})}));
    if(force||now-st.wxAt>WX_MS)jobs.push(getJSON(WX_URL).then(d=>{st.wx=d;st.wxAt=Date.now();store.set('wx',{at:st.wxAt,d})}).catch(()=>{}));
    await Promise.all(jobs);st.err='';
  }catch(e){
    st.err='Couldn’t reach the live feed — showing the last data saved on this phone.';
    if(!st.live){const c=store.get('live',null);if(c){st.live=c.d;st.liveAt=c.at;indexLive()}}
    if(!Object.keys(st.sched).length){const c=store.get('sched',null);if(c){st.sched=c.d;st.schedAt=c.at}}
  }
  if(!st.wx){const c=store.get('wx',null);if(c){st.wx=c.d;st.wxAt=c.at}}
  btn.classList.remove('spin');render();
}

/* ---------- park data helpers ---------- */
const byPark=id=>(st.live||[]).filter(e=>e.parkId===id);
const schedOn=(id,date=today())=>(st.sched[id]||[]).filter(s=>s.date===date);
const cleanType=t=>({TICKETED_EVENT:'Ticketed event',EXTRA_HOURS:'Extra hours',INFO:'Info',CLOSED:'Closed'}[t]||t);
function hoursLine(id,date=today()){
  const s=schedOn(id,date);const op=s.find(x=>x.type==='OPERATING');
  const extras=s.filter(x=>x.type!=='OPERATING').map(x=>({ticketed:/special ticketed/i.test(x.description||''),label:/special ticketed/i.test(x.description||'')?eventName(id,x.date):(x.description||cleanType(x.type)),txt:`${fmtT(x.openingTime)}–${fmtT(x.closingTime)}`}));
  return {op,main:op?`${fmtT(op.openingTime)} – ${fmtT(op.closingTime)}`:(s.length?'':'Closed / not posted'),extras,purchases:op?.purchases||[]};
}
/* Name a "Special Ticketed Event": first from the park's party shows in the live feed ("… at Disney Jollywood Nights"),
   then from the EVENTS list by date, otherwise the generic label. */
function eventName(id,date){
  const p=parkOf(id);const norm=s=>s.toLowerCase().replace(/[’']/g,'');
  const fromFeed=[...new Set(byPark(id).map(e=>(String(e.name).match(/ at ((?:Disney |Mickey)[^]*?(?:Party|Nights?|Bash|After Hours))$/i)||[])[1]).filter(Boolean).map(cleanName))];
  const listed=EVENTS.find(e=>e.ticket&&e.park===p?.k&&e.start&&date>=e.start&&date<=e.end&&(!e.nights||e.nights.includes(date)));
  if(listed&&(!fromFeed.length||fromFeed.some(n=>norm(n)===norm(listed.name))))return listed.name;
  if(fromFeed.length===1)return fromFeed[0];
  return listed?.name||'Special Ticketed Event';
}
/* Open = inside regular hours, Early Entry or Extended Evening (not a separately ticketed party). */
const windows=id=>(st.sched[id]||[]).filter(x=>x.type==='OPERATING'||/early entry|extended evening/i.test(x.description||''));
function isOpen(id){const now=Date.now();return windows(id).some(x=>now>=+new Date(x.openingTime)&&now<+new Date(x.closingTime))}
function nextOpen(id){const now=Date.now();return (st.sched[id]||[]).filter(x=>x.type==='OPERATING'&&+new Date(x.openingTime)>now).sort((a,b)=>new Date(a.openingTime)-new Date(b.openingTime))[0]}
function nextOpenTxt(id){const n=nextOpen(id);if(!n)return '';const d=n.date===today()?'today':n.date===ymd(new Date(Date.now()+864e5))?'tomorrow':dayName(n.date);return `Opens ${d} at ${fmtT(n.openingTime)}`}
const dur=ms=>{const m=Math.round(ms/60e3),h=Math.floor(m/60);return h?`${h}h ${m%60}m`:`${m}m`};
function openStatus(id){
  const {op}=hoursLine(id);const now=Date.now();
  if(isOpen(id)){const end=Math.max(...windows(id).filter(x=>now>=+new Date(x.openingTime)&&now<+new Date(x.closingTime)).map(x=>+new Date(x.closingTime)));return `Open · closes in ${dur(end-now)}`}
  if(op&&now<+new Date(op.openingTime))return `Opens in ${dur(+new Date(op.openingTime)-now)}`;
  return 'Closed'+(nextOpenTxt(id)?' · '+nextOpenTxt(id):'');
}
function closeTime(id){const op=hoursLine(id).op;return op?+new Date(op.closingTime):0}
const wait=e=>e.queue?.STANDBY?.waitTime??null;

/* ---------- ride timing from Disney's hourly forecast ---------- */
function fcNow(e){const now=Date.now();return (e.forecast||[]).find(x=>{const t=+new Date(x.time);return now>=t&&now<t+36e5})}
function belowUsual(e){
  const w=wait(e),f=fcNow(e);if(w==null||!f||f.waitTime==null||f.waitTime<20||e.status!=='OPERATING')return null;
  const save=f.waitTime-w;return save>=Math.max(10,f.waitTime*0.3)?{exp:f.waitTime,save}:null;
}
function bestLater(e){
  const w=wait(e);if(w==null||e.status!=='OPERATING')return null;
  const now=Date.now(),close=closeTime(e.parkId)||Infinity;
  const fut=(e.forecast||[]).filter(x=>x.waitTime!=null&&+new Date(x.time)>now&&+new Date(x.time)<close-30*60e3);
  if(!fut.length)return null;const best=fut.reduce((a,b)=>b.waitTime<a.waitTime?b:a);
  return best.waitTime<=w-15?best:null;
}
function timingTags(e){
  const b=belowUsual(e),l=bestLater(e),out=[];
  if(b)out.push(`<span class="tag good">Good time · usually ~${b.exp}</span>`);
  else if(l)out.push(`<span class="tag">Better later · ~${l.waitTime} at ${fmtT(l.time)}</span>`);
  return out.join('');
}
function llTags(e){
  const q=e.queue||{},out=[];
  const rt=q.RETURN_TIME,pr=q.PAID_RETURN_TIME,sr=q.SINGLE_RIDER,bg=q.BOARDING_GROUP;
  const rtTxt=(x,lbl)=>x.state==='AVAILABLE'&&x.returnStart?`${lbl} ${fmtT(x.returnStart)}`:x.state==='FINISHED'?`${lbl} gone`:x.state==='TEMP_FULL'?`${lbl} full now`:'';
  if(rt){const t=rtTxt(rt,'LL');if(t)out.push(`<span class="tag ll">${t}</span>`)}
  if(pr){const t=rtTxt(pr,'Single Pass');const p=pr.price?.formatted;if(t)out.push(`<span class="tag ll">${t}${p&&pr.state==='AVAILABLE'?' · '+p:''}</span>`)}
  if(sr&&sr.waitTime!=null)out.push(`<span class="tag">Single rider ${sr.waitTime}m</span>`);else if(sr&&e.status==='OPERATING')out.push(`<span class="tag">Single rider</span>`);
  if(bg)out.push(`<span class="tag ll">Boarding group${bg.currentGroupStart?` ${bg.currentGroupStart}–${bg.currentGroupEnd}`:''}</span>`);
  return out.join('');
}

/* ---------- shows ---------- */
const isMeet=n=>/^(Meet|Greet)|Character|Meet /i.test(n);
const marqueeDef=(p,e)=>!/ at /i.test(e.name)&&(p.marquee||[]).find(m=>m.re.test(cleanName(e.name)));
function marquee(p){
  const ents=byPark(p.id).filter(e=>e.entityType==='SHOW');
  return (p.marquee||[]).map(m=>{
    const e=ents.find(x=>!/ at /i.test(x.name)&&m.re.test(cleanName(x.name)));
    const ts=(e?.showtimes||[]).filter(s=>ymd(new Date(s.startTime))===today()).map(s=>s.startTime).sort();
    return {label:m.label,ts};
  });
}
function shows(id,{meets=st.meets}={}){
  const p=parkOf(id);
  return byPark(id).filter(e=>e.entityType==='SHOW'&&(e.showtimes||[]).length&&(meets||!isMeet(e.name))&&!marqueeDef(p,e));
}
function marqueeBlock(p){
  const ms=marquee(p);if(!ms.length)return '';const now=Date.now();
  return `<div class="marq"><div class="lbl">Tonight’s nighttime spectacular${ms.length>1?'s':''}</div>${ms.map(m=>`<div class="m"><span>${esc(m.label)}</span>${m.ts.length?`<b>${m.ts.map(t=>`<span class="${+new Date(t)<now-20*60e3?'gone':''}">${fmtT(t)}</span>`).join(', ')}</b>`:`<i>${hoursLine(p.id).extras.some(x=>x.ticketed)?'Not tonight · party night':'Not scheduled tonight'}</i>`}</div>`).join('')}</div>`;
}
const parklessShow=re=>(st.live||[]).find(e=>!e.parkId&&e.entityType==='SHOW'&&re.test(e.name));
function tonightItems(){
  const out=[];
  for(const p of THEME)for(const m of marquee(p))for(const t of m.ts)out.push({t,name:m.label,where:p.short,c:p.c});
  const ewp=parklessShow(/Electrical Water Pageant/i),dtl=parklessShow(/Drawn to Life/i);
  for(const [e,label,where] of [[ewp,'Electrical Water Pageant','Bay Lake & Seven Seas Lagoon'],[dtl,'Drawn to Life (Cirque du Soleil)','Disney Springs']])
    for(const s of e?.showtimes||[])if(ymd(new Date(s.startTime))===today())out.push({t:s.startTime,name:label,where,c:'#6a6f9c'});
  return out.sort((a,b)=>new Date(a.t)-new Date(b.t));
}

/* ---------- events ---------- */
const activeEvents=(k,date=today())=>EVENTS.filter(e=>e.start&&!e.ticket&&date>=e.start&&date<=e.end&&(k==null||e.park===k||e.park==='all'));
function eventNights(ev){
  const t=today();const p=parkByK(ev.park);
  if(ev.nights)return ev.nights.filter(d=>d>=t).map(d=>({date:d,txt:''}));
  if(!p)return [];
  return (st.sched[p.id]||[]).filter(x=>/special ticketed/i.test(x.description||'')&&x.date>=t&&x.date>=ev.start&&x.date<=ev.end&&eventName(p.id,x.date)===ev.name)
    .map(x=>({date:x.date,txt:`${fmtT(x.openingTime)}–${fmtT(x.closingTime)}`}));
}
function evWhen(ev){
  const t=today();if(ev.tba)return ev.tba;
  const range=`${shortDate(ev.start)} – ${shortDate(ev.end)}${ev.end.slice(0,4)!==t.slice(0,4)||ev.start.slice(0,4)!==ev.end.slice(0,4)?', '+ev.end.slice(0,4):''}`;
  if(t>=ev.start&&t<=ev.end){const left=daysBetween(t,ev.end);return `${range} · ${left===0?'last day today':left===1?'ends tomorrow':left+' days left'}`}
  if(t<ev.start){const n=daysBetween(t,ev.start);return `${range} · ${n===1?'starts tomorrow':'starts in '+n+' days'}`}
  return `${range} · ended`;
}

/* ---------- weather ---------- */
function wxIcon(code,isNight){const c=+code;const id=c===0||c===1?(isNight?'i-part':'i-sun'):c===2?'i-part':c===3?'i-cloud':c===45||c===48?'i-fog':c>=95?'i-storm':(c>=51&&c<=67)||(c>=80&&c<=82)?'i-rain':'i-cloud';return `<svg aria-hidden="true"><use href="#${id}"/></svg>`}
const wxWord=c=>{c=+c;return c===0?'Clear':c===1?'Mostly clear':c===2?'Partly cloudy':c===3?'Cloudy':c===45||c===48?'Fog':c>=95?'Thunderstorms':c>=80?'Showers':c>=61?'Rain':c>=51?'Drizzle':'Cloudy'};
function wxHours(n=10){
  const w=st.wx;if(!w?.hourly)return [];const now=Date.now();
  const out=[];w.hourly.time.forEach((t,i)=>{const ms=+new Date(t+':00-05:00');if(ms>now-36e5&&out.length<n)out.push({t:ms,temp:Math.round(w.hourly.temperature_2m[i]),p:w.hourly.precipitation_probability[i]??0,code:w.hourly.weather_code[i]})});
  return out;
}
function wxMini(){const w=st.wx;if(!w?.current)return '';const p=Math.max(0,...wxHours(3).map(h=>h.p));return `<span class="wx">${Math.round(w.current.temperature_2m)}°${p>=30?` · ${p}% rain`:''}</span>`}
function weatherCard(){
  const w=st.wx;if(!w?.current)return '';
  const hrs=wxHours(10);const sunset=w.daily?.sunset?.[0];const night=sunset&&Date.now()>+new Date(sunset+':00-05:00');
  const wet=hrs.find(h=>h.p>=50);
  const hourLbl=ms=>new Date(ms).toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric'}).replace(' AM','a').replace(' PM','p');
  return `<section class="card"><div class="wxcard">
    <div class="wxnow">${wxIcon(w.current.weather_code,night)}<span class="num">${Math.round(w.current.temperature_2m)}°</span></div>
    <div class="wxtxt"><b>${wxWord(w.current.weather_code)} at the parks</b>High ${Math.round(w.daily.temperature_2m_max[0])}° · low ${Math.round(w.daily.temperature_2m_min[0])}°${sunset?` · sunset ${fmtT(sunset+':00-05:00')}`:''}</div>
    ${wet?`<div class="wxalert">Rain likely ${wet===hrs[0]?'now':'around '+hourLbl(wet.t)} (${wet.p}%)</div>`:''}
    <div class="hours">${hrs.map((h,i)=>`<div class="hr">${i===0?'Now':hourLbl(h.t)}${wxIcon(h.code,sunset&&h.t>+new Date(sunset+':00-05:00'))}<b>${h.temp}°</b><span class="p${h.p>=50?' hi':''}">${h.p}%</span></div>`).join('')}</div>
  </div></section>`;
}

/* ---------- rendering ---------- */
function chips(){
  const items=[{k:'now',short:'Right now'},...THEME,{k:'resorts',short:'Resorts'},{k:'events',short:'Events'},{k:'water',short:'Water parks'}];
  $('#chips').innerHTML=items.map(p=>`<button class="chip" data-v="${p.k}" aria-pressed="${st.view===p.k}">${p.short}</button>`).join('');
}
function stamp(){
  if(!st.liveAt){$('#stamp').textContent=st.err?'Offline':'Loading…';return}
  const m=Math.round((Date.now()-st.liveAt)/60e3);
  $('#stamp').textContent=m<1?'Updated just now':`Updated ${m} min ago`;
}
function hero(p,{link=false}={}){
  const h=hoursLine(p.id);const ev=activeEvents(p.k).filter(e=>e.park===p.k);
  return `<div class="hero${link?' click':''}" style="--pc:${p.c}" ${link?`data-go="${p.k}"`:''}>
    ${wxMini()}
    <h2>${p.name}</h2>
    <div class="hrs">${h.main}</div>
    <div class="sub">${openStatus(p.id)}${h.extras.map(x=>` · ${esc(x.label)} ${x.txt}`).join('')}</div>
    ${ev.map(e=>`<span class="evchip">${esc(e.name.replace('EPCOT International ',''))} · through ${shortDate(e.end)}</span>`).join(' ')}
    ${marqueeBlock(p)}
  </div>`;
}
const closedMsg=p=>`<div class="closed"><b>Park closed</b>Ride times will appear when ${p.name} opens.${nextOpenTxt(p.id)?' '+nextOpenTxt(p.id)+'.':''}</div>`;
function waitBox(e){const w=wait(e),op=e.status==='OPERATING';return op&&w!=null?`<div class="wait ${wclass(w)}"><span class="num">${w}</span><small>min</small></div>`:`<div class="wait w-x"><span class="num">${op?'Open':e.status==='DOWN'?'Down':'—'}</span></div>`}
function rideRow(e,{park=false}={}){
  const op=e.status==='OPERATING';const fav=st.favs.has(e.id);const p=parkOf(e.parkId);
  const statusTag=e.status==='DOWN'?'<span class="tag down">Temporarily down</span>':e.status==='REFURBISHMENT'?'<span class="tag down">Refurbishment</span>':e.status==='CLOSED'?'<span class="tag">Closed</span>':'';
  return `<div class="row"><button class="star" data-fav="${e.id}" aria-pressed="${fav}" aria-label="Favorite ${esc(e.name)}">★</button>
   <div class="nm">${esc(cleanName(e.name))}<div class="meta">${park&&p?`<span class="tag park" style="--pc:${p.c}">${p.short}</span>`:''}${statusTag}${op?timingTags(e)+llTags(e):''}</div></div>${waitBox(e)}</div>`;
}
function goodNow(parks){
  return parks.filter(p=>isOpen(p.id)).flatMap(p=>byPark(p.id).filter(e=>e.entityType==='ATTRACTION'&&belowUsual(e))).sort((a,b)=>belowUsual(b).save-belowUsual(a).save);
}
function eventStrip(){
  const t=today();const items=[];
  for(const e of EVENTS.filter(e=>e.start&&!e.ticket&&t>=e.start&&t<=e.end))items.push({b:e.name.replace('EPCOT International ','EPCOT '),s:`Through ${shortDate(e.end)}`});
  for(const p of THEME)for(const x of hoursLine(p.id).extras.filter(x=>x.ticketed))items.push({b:x.label,s:`Tonight ${x.txt} · ${p.short}`});
  const next=EVENTS.filter(e=>e.start&&e.start>t).sort((a,b)=>a.start<b.start?-1:1)[0];
  if(next)items.push({b:next.name.replace('EPCOT International ','EPCOT '),s:evWhen(next).split(' · ')[1]});
  return items.length?`<div class="evstrip">${items.map(i=>`<button data-v="events"><b>${esc(i.b)}</b><span>${esc(i.s)}</span></button>`).join('')}</div>`:'';
}
function tonightCard(){
  const items=tonightItems();if(!items.length)return '';const now=Date.now();
  return `<section class="card"><div class="sect" style="margin:12px 14px 4px">Tonight across Walt Disney World</div>${items.map(i=>`<div class="tl${+new Date(i.t)<now-20*60e3?' past':''}"><b>${fmtT(i.t)}</b><span>${esc(i.name)}</span><span class="tag park" style="--pc:${i.c}">${esc(i.where)}</span></div>`).join('')}</section>`;
}
function parkCards(list){
  return `<div class="grid">${list.map(p=>{
    if(!isOpen(p.id))return `<section class="card">${hero(p,{link:true})}${closedMsg(p)}<div class="row"><span class="nm"></span><button class="tog" data-go="${p.k}">${p.short} shows &amp; hours →</button></div></section>`;
    const rides=byPark(p.id).filter(e=>e.entityType==='ATTRACTION');
    const open=rides.filter(e=>e.status==='OPERATING');const ws=open.map(wait).filter(w=>w!=null);
    const avg=ws.length?Math.round(ws.reduce((a,b)=>a+b,0)/ws.length):null;
    const favs=rides.filter(e=>st.favs.has(e.id));
    const top=(favs.length?favs:open.filter(e=>wait(e)!=null)).sort((a,b)=>(wait(b)??-1)-(wait(a)??-1)).slice(0,favs.length?8:4);
    return `<section class="card">${hero(p,{link:true})}
      <div class="stats"><div><span class="num">${open.length}</span><small>rides open</small></div>
      <div><span class="num">${avg??'—'}</span><small>avg wait</small></div>
      <div><span class="num">${ws.length?Math.max(...ws):'—'}</span><small>longest</small></div></div>
      ${top.length?`<div>${top.map(e=>rideRow(e)).join('')}</div>`:`<div class="empty">No wait times posted right now.</div>`}
      <div class="row"><span class="nm" style="font-weight:500;color:var(--mute);font-size:14px">${favs.length?'Your favorites':'Longest waits right now'}</span><button class="tog" data-go="${p.k}">All ${p.short} →</button></div>
    </section>`}).join('')}</div>`;
}
function homeView(){
  const good=goodNow(THEME).slice(0,6);
  return `${eventStrip()}<div class="grid">${weatherCard()}${tonightCard()}
    ${good.length?`<section class="card"><div class="sect" style="margin:12px 14px 4px">Good time to ride — shorter than usual right now</div>${good.map(e=>rideRow(e,{park:true})).join('')}</section>`:''}</div>
    <div class="sect" style="margin-top:22px">Parks</div>${parkCards(THEME)}`;
}
function ridesView(p){
  if(!isOpen(p.id))return `<div class="card">${closedMsg(p)}</div>`;
  let rides=byPark(p.id).filter(e=>e.entityType==='ATTRACTION');
  if(st.openOnly)rides=rides.filter(e=>e.status==='OPERATING'||e.status==='DOWN');
  if(st.q)rides=rides.filter(e=>e.name.toLowerCase().includes(st.q));
  const cmp=st.sort==='wait'?(a,b)=>(wait(b)??-1)-(wait(a)??-1)||a.name.localeCompare(b.name):(a,b)=>cleanName(a.name).localeCompare(cleanName(b.name));
  const favs=rides.filter(e=>st.favs.has(e.id)).sort(cmp),rest=rides.filter(e=>!st.favs.has(e.id)).sort(cmp);
  const good=st.q?[]:goodNow([p]);
  return `<div class="tools"><input type="search" id="q" placeholder="Search rides" value="${esc(st.q)}" autocomplete="off">
    <button class="tog" id="sort">Sort: ${st.sort==='wait'?'Longest wait':'A–Z'}</button>
    <label class="tog"><input type="checkbox" id="openOnly" ${st.openOnly?'checked':''}> Open only</label></div>
    ${good.length?`<div class="sect">Good time to ride</div><div class="card">${good.map(e=>rideRow(e)).join('')}</div>`:''}
    ${favs.length?`<div class="sect">Favorites</div><div class="card">${favs.map(e=>rideRow(e)).join('')}</div>`:''}
    <div class="sect">${favs.length||good.length?'All rides':'Rides'}</div>
    <div class="card">${rest.length?rest.map(e=>rideRow(e)).join(''):'<div class="empty">Nothing matches.</div>'}</div>`;
}
function llView(p){
  const h=hoursLine(p.id);const pur=h.purchases;const t=today();
  const pkg=pur.filter(x=>x.type==='PACKAGE');const singles=pur.filter(x=>x.type==='ATTRACTION');
  const rides=byPark(p.id).filter(e=>e.entityType==='ATTRACTION');
  const findRide=nm=>{const n=cleanName(nm.replace(/^Lightning Lane for /i,'')).toLowerCase();return rides.find(e=>cleanName(e.name).toLowerCase()===n)||rides.find(e=>cleanName(e.name).toLowerCase().includes(n)||n.includes(cleanName(e.name).toLowerCase()))};
  const tomorrow=hoursLine(p.id,ymd(new Date(Date.now()+864e5))).purchases.filter(x=>x.type==='PACKAGE');
  const mp=rides.filter(e=>e.queue?.RETURN_TIME);
  const avail=mp.filter(e=>e.queue.RETURN_TIME.state==='AVAILABLE'&&e.queue.RETURN_TIME.returnStart).sort((a,b)=>new Date(a.queue.RETURN_TIME.returnStart)-new Date(b.queue.RETURN_TIME.returnStart));
  const gone=mp.filter(e=>!avail.includes(e));
  const price=x=>x.price?.formatted||'—';
  return `<div class="sect">Lightning Lane Multi Pass</div><div class="card">
    ${pkg.length?pkg.map(x=>`<div class="row"><div class="nm">Today<div class="meta">${x.available===false?'<span class="tag down">Sold out</span>':'<span class="tag good">Available</span>'}</div></div><div class="side"><b>${price(x)}</b>per person</div></div>`).join(''):'<div class="empty">No Multi Pass price posted for today.</div>'}
    ${tomorrow.map(x=>`<div class="row"><div class="nm">Tomorrow<div class="meta">${x.available===false?'<span class="tag down">Sold out</span>':'<span class="tag">On sale</span>'}</div></div><div class="side"><b>${price(x)}</b>per person</div></div>`).join('')}
  </div>
  ${singles.length?`<div class="sect">Lightning Lane Single Pass</div><div class="card">${singles.map(x=>{const r=findRide(x.name);const pr=r?.queue?.PAID_RETURN_TIME;const ret=pr?.state==='AVAILABLE'&&pr.returnStart?`Next return ${fmtT(pr.returnStart)}`:'';
    return `<div class="row"><div class="nm">${esc(cleanName(x.name.replace(/^Lightning Lane for /i,'')))}<div class="meta">${x.available===false||pr?.state==='FINISHED'?'<span class="tag down">Sold out</span>':`<span class="tag good">${ret||'Available'}</span>`}${r&&wait(r)!=null?`<span class="tag">Standby ${wait(r)} min</span>`:''}</div></div><div class="side"><b>${price(x)}</b>per person</div></div>`}).join('')}</div>`:''}
  <div class="sect">Multi Pass return times right now</div><div class="card">
    ${avail.length?avail.map(e=>`<div class="row"><div class="nm">${esc(cleanName(e.name))}<div class="meta">${wait(e)!=null?`<span class="tag">Standby ${wait(e)} min</span>`:''}</div></div><div class="side"><b>${fmtT(e.queue.RETURN_TIME.returnStart)}</b>next return</div></div>`).join(''):`<div class="empty">${isOpen(p.id)?'No return times available right now.':'Return times appear on the day, once Lightning Lane opens.'}</div>`}
    ${gone.length?`<div class="note">Gone for today: ${gone.map(e=>esc(cleanName(e.name))).join(', ')}</div>`:''}
  </div>
  <p class="foot" style="margin-top:12px">Buy and book in the My Disney Experience app. Prices are per person, before tax.</p>`;
}
function showsView(p){
  const now=Date.now();
  let list=shows(p.id).filter(e=>!st.q||e.name.toLowerCase().includes(st.q)).map(e=>{
    const ts=[...e.showtimes].sort((a,b)=>new Date(a.startTime)-new Date(b.startTime));
    const nxt=ts.find(s=>+new Date(s.endTime||s.startTime)>=now);
    return {e,ts,nxt};
  });
  list.sort((a,b)=>(a.nxt?0:1)-(b.nxt?0:1)||(a.nxt&&b.nxt?new Date(a.nxt.startTime)-new Date(b.nxt.startTime):0)||a.e.name.localeCompare(b.e.name));
  const row=({e,ts,nxt})=>{
    const range=ts.every(s=>s.type!=='Performance Time');
    const chips=ts.map(s=>{const past=+new Date(s.endTime||s.startTime)<now;const isN=s===nxt;
      const lbl=range?`${fmtT(s.startTime)}–${fmtT(s.endTime)}`:fmtT(s.startTime);
      return `<span class="t${past?' past':''}${isN?' next':''}">${lbl}</span>`}).join('');
    return `<div class="row"><div class="nm">${esc(cleanName(e.name))}<div class="times">${chips}</div></div></div>`;
  };
  const ms=marquee(p);
  return `<div class="tools"><input type="search" id="q" placeholder="Search shows" value="${esc(st.q)}" autocomplete="off">
    <label class="tog"><input type="checkbox" id="meets" ${st.meets?'checked':''}> Character meets</label></div>
    ${ms.length?`<div class="sect">Nighttime spectacular${ms.length>1?'s':''}</div><div class="card">${ms.map(m=>`<div class="row"><div class="nm">${esc(m.label)}<div class="times">${m.ts.length?m.ts.map(t=>`<span class="t${+new Date(t)<now?' past':' next'}">${fmtT(t)}</span>`).join(''):'<span class="tag">Not scheduled tonight</span>'}</div></div></div>`).join('')}</div>`:''}
    <div class="sect">Other shows today</div>
    <div class="card">${list.length?list.map(row).join(''):'<div class="empty">No show times posted for today.</div>'}</div>`;
}
function hoursView(list){
  const days=[...new Set(list.flatMap(p=>(st.sched[p.id]||[]).map(s=>s.date)))].sort().filter(d=>d>=today()).slice(0,10);
  return list.map(p=>`<div class="sect">${list.length>1?p.name:'Next 10 days'}</div><div class="card" style="--pc:${p.c}"><table class="hrsT"><tbody>${days.map(d=>{
    const h=hoursLine(p.id,d);const pass=h.purchases.find(x=>x.type==='PACKAGE');const evs=activeEvents(p.k,d).filter(e=>e.park===p.k);
    return `<tr class="${d===today()?'today':''}"><td>${d===today()?'Today':dayName(d)}</td><td>${h.main||'—'}${h.extras.map(x=>`<span class="x">${esc(x.label)} ${x.txt}</span>`).join('')}${d===today()?marquee(p).filter(m=>m.ts.length).map(m=>`<span class="x">${esc(m.label)} ${m.ts.map(fmtT).join(', ')}</span>`).join(''):''}${evs.map(e=>`<span class="x">${esc(e.name.replace('EPCOT International ',''))}</span>`).join('')}${pass?.price?`<span class="x">LL Multi Pass ${pass.price.formatted}${pass.available===false?' (sold out)':''}</span>`:''}</td></tr>`}).join('')}</tbody></table></div>`).join('');
}
function resortsView(){
  const q=st.rq;const now=Date.now();
  const ewp=parklessShow(/Electrical Water Pageant/i),dtl=parklessShow(/Drawn to Life/i);
  const dsRides=(st.live||[]).filter(e=>!e.parkId&&e.entityType==='ATTRACTION'&&/Aerophile|Amphicar|Carousel|Train Express/i.test(e.name));
  const tchips=e=>(e?.showtimes||[]).filter(s=>ymd(new Date(s.startTime))===today()).map(s=>`<span class="t${+new Date(s.startTime)<now?' past':' next'}">${fmtT(s.startTime)}</span>`).join('')||'<span class="tag">Not scheduled tonight</span>';
  const isLounge=n=>/Lounge|Pool Bar|Grotto|Tiki|Libations|Margaritas|Spirits|Grogs|AbracadaBar|Cove Bar|Stargazers|Belle Vue|Cantina|Laguna Bar|Wine Bar$|Hangar Bar|Tavern|Sand Bar|Chill|Stir|Hurly/i.test(n)&&!/Restaurant|Grill|Dining/i.test(n);
  const walkup=id=>{const e=st.liveById[id];if(!e)return '';const w=e.queue?.STANDBY?.waitTime??(e.diningAvailability||[]).find(d=>d.partySize===2)?.waitTime;return w!=null?`<span class="tag good">Walk-up ~${w} min</span>`:''};
  const item=(r,[id,n])=>`<li><span>${esc(cleanName(n))} ${walkup(id)}</span><a href="https://www.google.com/search?q=${encodeURIComponent(cleanName(n)+' '+r.name+' Disney World menu')}" target="_blank" rel="noopener">Menu ↗</a></li>`;
  const resorts=RESORTS.map(r=>({...r,items:q?r.items.filter(([,n])=>n.toLowerCase().includes(q)||r.name.toLowerCase().includes(q)):r.items})).filter(r=>r.items.length);
  const groups=RES_GROUPS.map(([g,label])=>({label,rs:resorts.filter(r=>r.g===g)})).filter(x=>x.rs.length);
  return `<div class="sect">Tonight around the resorts</div><div class="card">
     <div class="row"><div class="nm">Electrical Water Pageant<div class="meta" style="font-weight:400;color:var(--mute);font-size:14px">Floating light parade on Seven Seas Lagoon and Bay Lake, passing the monorail resorts, Wilderness Lodge and Fort Wilderness. Time shown is Disney’s listed start.</div><div class="times">${tchips(ewp)}</div></div></div>
     <div class="row"><div class="nm">Drawn to Life · Cirque du Soleil<div class="meta" style="font-weight:400;color:var(--mute);font-size:14px">Disney Springs · separate ticket</div><div class="times">${tchips(dtl)}</div></div></div>
     ${dsRides.length?`<div class="row"><div class="nm">Disney Springs extras<div class="meta">${dsRides.map(e=>`<span class="tag${e.status==='OPERATING'?' good':e.status==='DOWN'?' down':''}">${esc(cleanName(e.name).replace(/ – .*/,''))}: ${e.status==='OPERATING'?'open':e.status==='DOWN'?'down':'closed'}</span>`).join('')}</div></div></div>`:''}
   </div>
   <div class="tools" style="margin-top:16px"><input type="search" id="rq" placeholder="Search resorts, restaurants & lounges" value="${esc(q)}" autocomplete="off"></div>
   ${groups.length?groups.map(g=>`<div class="sect">${g.label}</div><div class="card">${g.rs.map(r=>{
      const din=r.items.filter(([,n])=>!isLounge(n)),lo=r.items.filter(([,n])=>isLounge(n));
      return `<details class="res" data-r="${esc(r.name)}"${q||st.openRes.has(r.name)?' open':''}><summary><span class="nm">${esc(r.name)}<small>${esc(r.tr)} · ${r.items.length} places</small></span></summary><div class="dine">
        ${din.length?`<h4>Dining</h4><ul>${din.map(x=>item(r,x)).join('')}</ul>`:''}${lo.length?`<h4>Lounges & bars</h4><ul>${lo.map(x=>item(r,x)).join('')}</ul>`:''}</div></details>`}).join('')}</div>`).join(''):'<div class="card"><div class="empty">Nothing matches.</div></div>'}
   <p class="foot" style="margin-top:12px">Menu links search for Disney’s menu page. Reservations are in the My Disney Experience app.</p>`;
}
function eventsView(){
  const t=today();
  const now=EVENTS.filter(e=>e.start&&t>=e.start&&t<=e.end).sort((a,b)=>a.end<b.end?-1:1);
  const soon=EVENTS.filter(e=>e.start&&t<e.start).sort((a,b)=>a.start<b.start?-1:1);
  const tba=EVENTS.filter(e=>e.tba);
  const where=e=>e.park==='all'?'All parks & resorts':parkByK(e.park)?.name||'';
  const row=e=>{const p=parkByK(e.park);const nights=e.ticket&&e.start?eventNights(e):[];
    return `<div class="evrow" style="--pc:${p?.c||'#5b4bdb'}"><h3>${esc(e.name)}${e.ticket?'<span class="pill tix">Separate ticket</span>':'<span class="pill">Included with admission</span>'}</h3>
      <div class="when">${esc(where(e))} · ${esc(evWhen(e))}</div><p>${esc(e.blurb)}</p>
      ${nights.length?`<div class="times">${nights.slice(0,8).map(n=>`<span class="t${n.date===t?' next':''}">${n.date===t?'Tonight':dayName(n.date)}${n.txt?' · '+n.txt:''}</span>`).join('')}${nights.length>8?`<span class="tag">+${nights.length-8} more nights</span>`:''}</div>`:''}</div>`};
  return `${now.length?`<div class="sect">Happening now</div><div class="card">${now.map(row).join('')}</div>`:''}
    ${soon.length?`<div class="sect">Coming up</div><div class="card">${soon.map(row).join('')}</div>`:''}
    ${tba.length?`<div class="sect">Dates not announced yet</div><div class="card">${tba.map(row).join('')}</div>`:''}
    <p class="foot" style="margin-top:12px">Party nights come from Disney’s live park calendar. Festival dates as announced by Disney, last checked Nov 25, 2026.</p>`;
}
function render(){
  chips();stamp();
  const m=$('#main');const banner=st.err?`<div class="banner">${esc(st.err)}</div>`:'';
  if(!st.live){m.innerHTML=banner+'<div class="empty">Loading live park data…</div>';return}
  document.querySelectorAll('details.res').forEach(d=>d.open?st.openRes.add(d.dataset.r):st.openRes.delete(d.dataset.r));
  const focusId=document.activeElement?.id;
  if(st.view==='now')m.innerHTML=banner+homeView();
  else if(st.view==='water')m.innerHTML=banner+parkCards(PARKS.slice(4))+hoursView(PARKS.slice(4));
  else if(st.view==='resorts')m.innerHTML=banner+resortsView();
  else if(st.view==='events')m.innerHTML=banner+eventsView();
  else{
    const p=parkByK(st.view)||THEME[0];
    const tabs=[['rides','Rides'],['ll','<span class="lw">Lightning Lane</span><span class="ln">Lightning</span>'],['shows','Shows'],['hours','Hours']];
    if(!tabs.some(([k])=>k===st.tab))st.tab='rides';
    m.innerHTML=banner+`<div class="card" style="--pc:${p.c}">${hero(p)}</div>
      <div class="seg" style="--pc:${p.c}">${tabs.map(([k,l])=>`<button data-tab="${k}" aria-pressed="${st.tab===k}">${l}</button>`).join('')}</div>
      <div style="--pc:${p.c}">${st.tab==='rides'?ridesView(p):st.tab==='ll'?llView(p):st.tab==='shows'?showsView(p):hoursView([p])}</div>`;
  }
  m.insertAdjacentHTML('beforeend',`<p class="foot">Live park data from <a href="https://themeparks.wiki" target="_blank" rel="noopener">ThemeParks.wiki</a> · weather from <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> · waits refresh every 5 minutes · times are Orlando time.<br>Unofficial — not affiliated with Disney.</p>`);
  if(focusId==='q'||focusId==='rq'){const q=document.getElementById(focusId);if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-v],[data-go],[data-tab],[data-fav],#sort,#refresh');if(!t)return;
  if(t.dataset.v||t.dataset.go){st.view=t.dataset.v||t.dataset.go;st.q='';store.set('view',st.view);render();window.scrollTo(0,0)}
  else if(t.dataset.tab){st.tab=t.dataset.tab;st.q='';store.set('tab',st.tab);render()}
  else if(t.dataset.fav){const id=t.dataset.fav;st.favs.has(id)?st.favs.delete(id):st.favs.add(id);store.set('favs',[...st.favs]);render()}
  else if(t.id==='sort'){st.sort=st.sort==='wait'?'name':'wait';store.set('sort',st.sort);render()}
  else if(t.id==='refresh'){load(true)}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){st.q=ev.target.value.trim().toLowerCase();render()}
  if(ev.target.id==='rq'){st.rq=ev.target.value.trim().toLowerCase();render()}
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='openOnly'){st.openOnly=ev.target.checked;store.set('openOnly',st.openOnly);render()}
  if(ev.target.id==='meets'){st.meets=ev.target.checked;store.set('meets',st.meets);render()}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(false)});
setInterval(()=>{if(!document.hidden)load(false)},60e3);
setInterval(stamp,30e3);
render();load(true);
}
</script>
</body>
</html>
